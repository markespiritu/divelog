      buildPressureLabels(samples, gasSwitchEvents, { isShown: isShownSwitch })
        .filter((l) => vis.tanks[l.tank])
        .map((l) => ({ ...l, color: COLORS.tanks[l.tank], text: `${Math.round(l.v)} bar` }));

    // Toggles, the same in both views. Line and band toggles come first, with
    // their swatch; labels that sit on a line are greyed out while it's hidden.
    const LIMIT_SWATCH = { color: "var(--status-critical)", dashed: true };
    const depthToggles = () => [
      visToggle("Depth", "depth", { swatch: { color: COLORS.depth } }),
      visToggle("Deco ceiling", "ceiling", { swatch: LIMIT_SWATCH, title: "Deco ceiling (CEIL)" }),
      visToggle("MOD", "mod", { swatch: LIMIT_SWATCH, title: `Maximum operating depth at PPO2 ${MOD_PPO2}` }),
      visToggle("Max depth", "maxDepth", { disabled: !vis.depth, title: "Label the maximum depth" }),
      visToggle("SurfGF", "surfGf", { disabled: !vis.depth, title: "Label the surface gradient factor on surfacing" }),
      visToggle("Highlight exceeded limits", "depthHighlight", { disabled: !vis.depth || !(vis.ceiling || vis.mod) }),
    ];
    const tankToggles = () => [
      ...tanksInUse.map((i) => visToggle(tankLabels[i].full, "tanks", { tank: i, swatch: { color: COLORS.tanks[i] } })),
      // Only offered when there are inferred switches to hide.
      ...(gasSwitchEvents.some((e) => e.inferred) ? [visToggle("Inferred gas switches", "inferredSwitches", { title: "Switches between tanks of the same mix, inferred from tank pressures" })] : []),
    ];
    const ppo2Toggles = () => [
      visToggle("PPO2", "ppo2", { swatch: { color: COLORS.ppo2 } }),
      visToggle("Highlight exceeded limits", "highlight", { disabled: !vis.ppo2 }),
    ];
    const ascentToggles = () => [
      visToggle("Ascent rate", "ascent", { swatch: { color: COLORS.ascent } }),
      visToggle("Max ascent", "maxAscent", { disabled: !vis.ascent, title: "Label the fastest ascent rate" }),
      {
        id: "ascentWindow", label: "Smoothing", value: ascentWindow, disabled: !vis.ascent,
        options: ASCENT_WINDOWS.map((sec) => ({ value: sec, label: `${sec} s` })),
        onChange: (sec) => {
          ascentWindow = sec;
          try { localStorage.setItem("divelog.ascentWindow", String(sec)); } catch (e) {}
          renderCharts();
        },
      },
    ];
    // Temperature is dashed in the combined chart, solid in its own panel.
    const tempToggles = (dashed) => [
      visToggle("Temperature", "temp", { swatch: { color: COLORS.temp, dashed } }),
      visToggle("Starting temp", "startTemp", { disabled: !vis.temp, title: "Label the water temperature at the start of the dive" }),
      visToggle("Min temp", "minTemp", { disabled: !vis.temp, title: "Label the coldest water temperature" }),
    ];

    // Each panel stays when its lines are switched off, so its toggles do too.
    // With a chart maximized, only that one is drawn, `extra` px taller.
    function renderSeparate(width, extra) {
      const panelSpecs = [
        // Depth panel with, optionally, the deco-ceiling band and the MOD floor
        {
          id: "depth",
          title: "Depth",
          toggles: depthToggles(),
          height: DEPTH_HEIGHT,
          yDomain: [0, depthMax],
          invertY: true,
          yFmt: (v) => v + "m",
          bands: depthBands(depthMax),
          peaks: depthPeaks(),
          series: vis.depth
            ? [{ name: "Depth", color: COLORS.depth, points: pointsOf((s) => s.depth) }, ...limitOverlays()]
            : [],
        },
        // Tank pressure panel (only tanks that have any data; none without air integration)
        tanksInUse.length && {
          id: "tanks",
          title: "Tank pressure",
          toggles: tankToggles(),
          height: 280,
          yDomain: [0, tankMax],
          yFmt: (v) => Math.round(v) + " bar",
          series: shownTanks().map((i) => ({
            name: tankLabels[i].full, color: COLORS.tanks[i], points: pointsOf((s) => s.tankPressureBar[i]),
          })),
          markers: shownSwitches(),
          pointLabels: pressureLabelsFor(),
        },
        // PPO2 panel
        {
          id: "ppo2",
          title: "PPO2",
          toggles: ppo2Toggles(),
          height: 156,
          yDomain: ppo2Domain,
          yFmt: (v) => v.toFixed(1),
          series: vis.ppo2
            ? [{ name: "PPO2", color: COLORS.ppo2, points: pointsOf((s) => s.ppo2) }, vis.highlight && overPpo2Series].filter(Boolean)
            : [],
          refLines: ppo2RefLines(),
          peaks: ppo2Peaks(),
        },
        // Ascent rate panel, ascending above the zero line
        {
          id: "ascent",
          title: `Ascent rate (m/min, ${ascentWindow} s smoothing) — descent below zero`,
          toggles: ascentToggles(),
          height: 156,
          yDomain: ascentDomain(),
          yFmt: (v) => v.toFixed(0),
          series: ascentSeries(),
          peaks: ascentPeaks(),
        },
        // Water temp panel
        {
          id: "temp",
          title: "Water temperature",
          toggles: tempToggles(false),
          height: 156,
          yDomain: tempDomain,
          yFmt: (v) => v.toFixed(0) + "°",
          series: vis.temp ? [{ name: "Temp", color: COLORS.temp, points: pointsOf((s) => s.waterTempC) }] : [],
          peaks: tempPeaks(),
        },
      ].filter(Boolean);

      const shown = zoom || xDomain;
      panelSpecs.filter((p) => !maximized || p.id === maximized).forEach(({ id, height, ...spec }) => {
        drawPanel({ ...spec, height: height + extra, width, xDomain: shown, maximize: maximizeFor(id) }).dataset.panel = id;
      });

      drawXAxis(width, shown);
      setupCrosshair(samples, width, shown, shownSwitches(), COLORS, tankLabels, vis, ascentRates(), setZoom);
    }

    // One tall chart on the depth axis, which runs on past the deepest point
    // (e.g. to 50 m for a 44 m dive) so the profile mostly clears the bottom
    // slices. Tank pressure sits so that 200 bar lines up with 10 m; PPO2,
    // ascent rate and water temperature stack below it, and the chart is as
    // tall as that stack needs. Hidden lines keep their slice and axis, so the
    // rest doesn't move.
    const combinedDepthMax = Math.ceil((deepest.depth + 5) / 10) * 10;
    // Slice heights in px of plot area.
    const COMBINED_SLICES = { pressure: 280, gap: 22, ppo2: 66, ascent: 77, temp: 85 };
    // The plot height follows from the slices, all linear in them, so
    // stretching every slice by the same factor makes the plot `extra` px taller.
    function combinedLayout(extra = 0) {
      const sliceSum = ({ pressure, gap, ppo2, ascent, temp }) =>
        (pressure * 200 / tankMax + 3 * gap + ppo2 + ascent + temp) / (1 - 10 / combinedDepthMax);
      const k = Math.max(0.3, 1 + extra / sliceSum(COMBINED_SLICES));
      const { pressure, gap, ppo2, ascent, temp } = Object.fromEntries(
        Object.entries(COMBINED_SLICES).map(([key, px]) => [key, px * k]));
      const below200 = pressure * 200 / tankMax;
      // 10 m sits at 10 / depthMax of the plot height, and everything from
      // there down is fixed, which pins the plot height.
      const innerH = sliceSum({ pressure, gap, ppo2, ascent, temp });
      const f = (px) => px / innerH;
      const pressureBottom = 10 / combinedDepthMax + f(below200);
      const ppo2Top = pressureBottom + f(gap);
      const ascentTop = ppo2Top + f(ppo2 + gap);
      const tempTop = ascentTop + f(ascent + gap);
      return {
        height: Math.round(innerH) + COMBINED_MARGIN.top + COMBINED_MARGIN.bottom,
        pressure: [pressureBottom - f(pressure), pressureBottom],
        ppo2: [ppo2Top, ppo2Top + f(ppo2)],
        ascent: [ascentTop, ascentTop + f(ascent)],
        temp: [tempTop, 1],
        dividers: [pressureBottom - f(pressure), ppo2Top - f(gap / 2), ascentTop - f(gap / 2), tempTop - f(gap / 2)],
      };
    }
    function renderCombined(width, extra) {
      const layout = combinedLayout(extra);
      const shown = zoom || xDomain;
      const pressureScale = { domain: [0, tankMax], band: layout.pressure };
      const ppo2Scale = { domain: ppo2Domain, band: layout.ppo2 };
      const ascentScale = { domain: ascentDomain(), band: layout.ascent };
      const tempScale = { domain: tempDomain, band: layout.temp };

      const series = [
        ...shownTanks().map((i) => ({
          name: tankLabels[i].full, color: COLORS.tanks[i], points: pointsOf((s) => s.tankPressureBar[i]), ...pressureScale,
        })),
        vis.ppo2 && { name: "PPO2", color: COLORS.ppo2, points: pointsOf((s) => s.ppo2), ...ppo2Scale },
        vis.ppo2 && vis.highlight && { ...overPpo2Series, ...ppo2Scale },
        ...ascentSeries(ascentScale),
        vis.temp && { name: "Temp", color: COLORS.temp, dashed: true, points: pointsOf((s) => s.waterTempC), ...tempScale },
        // Depth last so it draws on top of everything else.
        vis.depth && { name: "Depth", color: COLORS.depth, width: 2, points: pointsOf((s) => s.depth) },
        ...(vis.depth ? limitOverlays() : []),
      ].filter(Boolean);

      drawPanel({
        title: "Dive profile",
        maximize: maximizeFor("combined"),
        height: layout.height,
        width,
        margin: COMBINED_MARGIN,
        xDomain: shown,
        yDomain: [0, combinedDepthMax],
        invertY: true,
        yFmt: (v) => v + "m",
        bands: depthBands(combinedDepthMax),
        peaks: [...depthPeaks(), ...ppo2Peaks(ppo2Scale), ...ascentPeaks(ascentScale), ...tempPeaks(tempScale)],
        series,
        refLines: [...ppo2RefLines(ppo2Scale), ascentZeroLine(ascentScale)],
        dividers: layout.dividers,
        rightAxes: [
          { ...pressureScale, ticks: 4, fmt: (v) => Math.round(v) + " bar" },
          { ...ppo2Scale, ticks: 3, fmt: (v) => v.toFixed(1) + " atm" },
          { ...ascentScale, ticks: 3, fmt: (v) => v.toFixed(0) + " m/min" },
          { ...tempScale, ticks: 3, fmt: (v) => v.toFixed(0) + "°C" },
        ],
        markers: shownSwitches(),
        pointLabels: pressureLabelsFor(),
        pointLabelScale: pressureScale,
      }).dataset.panel = "combined";

      drawXAxis(width, shown, COMBINED_MARGIN);
      // A column per group where there's room; otherwise ascent rate goes
      // under PPO2, making four columns that wrap two to a row.
      const depthGroup = { title: "Depth", toggles: depthToggles() };
      const tankGroup = tanksInUse.length && { title: "Tanks", toggles: tankToggles() };
      const ppo2Group = { title: "PPO2", toggles: ppo2Toggles() };
      const ascentGroup = { title: "Ascent rate", toggles: ascentToggles() };
      const tempGroup = { title: "Temperature", toggles: tempToggles(true) };
      drawToggleGrid([
        [[depthGroup], tankGroup && [tankGroup], [ppo2Group], [ascentGroup], [tempGroup]].filter(Boolean),
        [[depthGroup], tankGroup && [tankGroup], [ppo2Group, ascentGroup], [tempGroup]].filter(Boolean),
      ]);
      setupCrosshair(samples, width, shown, shownSwitches(), COLORS, tankLabels, vis, ascentRates(), setZoom);
    }

    function renderCharts() {
      // Measuring labels mid-rebuild lays out the page while the stack is
      // empty, which clamps the scroll position to the shorter page. Put it
      // back afterwards, along with focus on the toggle that was just used.
      const scrollY = window.scrollY;
      const focused = stackEl.contains(document.activeElement) && document.activeElement.closest(".panel-toggle");
      const focusedId = focused && focused.dataset.toggle;
      const focusedZoom = zoomBar.contains(document.activeElement) && document.activeElement.dataset.zoom;
      // A maximized chart is drawn at its normal size first, then again
      // resized by whatever room is left in the window: taller, or shorter to
      // keep its toggles in view, but no shorter than half the window (as on
      // a phone, where the toggles run long); the overlay scrolls instead.
      const draw = (extra) => {
        stackEl.innerHTML = "";
        panels.length = 0;
        // Out of view under a maximized chart, so the zoom bar goes above it.
        if (maximized) stackEl.appendChild(zoomBar);
        else if (zoomBar.parentNode !== toolbarEl) toolbarEl.append(zoomBar);
        const width = maximized
          ? stackEl.clientWidth - 32
          : Math.min(1048, stackEl.clientWidth || root.clientWidth || 1048);
        if (chartView === "combined") renderCombined(width, extra);
        else renderSeparate(width, extra);
      };
      // A maximize left over from the other view falls back to normal.
      if (maximized && !(chartView === "combined" ? maximized === "combined" : maximized !== "combined")) {
        maximized = null;
        stackEl.classList.remove("maximized");
        document.documentElement.classList.remove("chart-maximized");
      }
      draw(0);
      if (maximized) {
        const end = document.createElement("div");
        stackEl.appendChild(end);
        const room = stackEl.clientHeight - parseFloat(getComputedStyle(stackEl).paddingBottom) - end.offsetTop;
        const chartH = panels[0].svg.getBoundingClientRect().height;
        draw(Math.max(room, Math.min(0, stackEl.clientHeight / 2 - chartH)));
      }
      // The crosshair starts hidden again, so the tooltip does too.
      tooltip.style.opacity = "0";
      stackEl.appendChild(tooltip);
      window.scrollTo(0, scrollY);
      if (focusedId) {
        const again = [...stackEl.querySelectorAll(".panel-toggle")].find((l) => l.dataset.toggle === focusedId);
        if (again) again.querySelector("input").focus({ preventScroll: true });
      }
      if (focusedZoom && !zoomBar.contains(document.activeElement)) {
        const btn = zoomBar.querySelector(`[data-zoom="${focusedZoom}"]`);
        if (btn && !btn.disabled) btn.focus({ preventScroll: true });
      }
    }

    renderCharts();
    buildTable(samples, { tankLabels, tanksInUse, gasSwitchEvents, colors: COLORS });
    renderMap(dive);

    let resizeTimer = null;
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(renderCharts, 120);
    });

    document.getElementById("table-toggle").addEventListener("click", () => {
      const wrap = document.getElementById("table-wrap");
      const showing = wrap.style.display === "block";
      wrap.style.display = showing ? "none" : "block";
      document.getElementById("table-toggle").textContent = showing ? "Show data table" : "Hide data table";
    });
  }

  main();
})();
</script>
</body>
</html>
