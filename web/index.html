<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Perdix — Dive Log</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root {
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --page-plane:     #f9f9f7;
    --text-primary:   #0b0b0b;
    --depth-line:     #3d3c38;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --gridline:       #e1e0d9;
    --baseline:       #c3c2b7;
    --border:         rgba(11,11,11,0.10);
    --series-1:       #2a78d6; /* blue   */
    --series-2:       #eb6834; /* orange */
    --series-3:       #1baf7a; /* aqua   */
    --series-4:       #eda100; /* yellow */
    --series-5:       #8a4fd6; /* violet */
    --status-critical:#d03b3b;
    --status-good:    #0ca30c;
    --seq-100:        #cde2fb;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface-1:      #1a1a19;
      --page-plane:     #0d0d0d;
      --text-primary:   #ffffff;
      --depth-line:     #d6d5cf;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --gridline:       #2c2c2a;
      --baseline:       #383835;
      --border:         rgba(255,255,255,0.10);
      --series-1:       #3987e5;
      --series-2:       #d95926;
      --series-3:       #199e70;
      --series-4:       #c98500;
      --series-5:       #a078ec;
      --status-critical:#e66767;
      --status-good:    #0ca30c;
      --seq-100:        #184f95;
      --map-tile-filter: invert(1) hue-rotate(180deg) brightness(0.95) contrast(0.9) saturate(0.6);
      --map-bg:         #262624;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-1:      #1a1a19;
    --page-plane:     #0d0d0d;
    --text-primary:   #ffffff;
    --depth-line:     #d6d5cf;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --gridline:       #2c2c2a;
    --baseline:       #383835;
    --border:         rgba(255,255,255,0.10);
    --series-1:       #3987e5;
    --series-2:       #d95926;
    --series-3:       #199e70;
    --series-4:       #c98500;
    --series-5:       #a078ec;
    --status-critical:#e66767;
    --status-good:    #0ca30c;
    --seq-100:        #184f95;
    --map-tile-filter: invert(1) hue-rotate(180deg) brightness(0.95) contrast(0.9) saturate(0.6);
    --map-bg:         #262624;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--page-plane);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--text-primary);
  }
  .viz-root { padding: 24px; max-width: 1080px; margin: 0 auto; }

  .header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
  .header h1 { font-size: 22px; margin: 0 0 4px; }
  .header .sub { color: var(--text-secondary); font-size: 14px; }
  .theme-toggle {
    border: 1px solid var(--border); background: var(--surface-1); color: var(--text-secondary);
    border-radius: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer;
  }

  .stats {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 1px; background: var(--gridline); border: 1px solid var(--border);
    border-radius: 10px; overflow: hidden; margin-bottom: 20px;
  }
  .stat { background: var(--surface-1); padding: 12px 14px; }
  .stat .label { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-muted); margin-bottom: 4px; }
  .stat .value { font-size: 18px; font-variant-numeric: tabular-nums; }
  .stat .value .unit { font-size: 12px; color: var(--text-secondary); font-weight: normal; margin-left: 2px; }

  .panel {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px 8px; margin-bottom: 12px;
  }
  .panel-title { position: relative; z-index: 2; font-size: 13px; color: var(--text-secondary); margin-bottom: 2px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap: 4px 14px;}
  .panel-controls { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 14px; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--text-secondary); }
  .legend .key { white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; }
  .legend .swatch { width: 14px; height: 2px; border-radius: 2px; display:inline-block; }
  .panel-toggle { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-secondary); cursor: pointer; user-select: none; }
  .panel-toggle input { cursor: pointer; }
  .gas-switch-tag { fill: var(--text-secondary); font-size: 9px; }

  .chart-toolbar { display: flex; justify-content: flex-end; margin-bottom: 8px; }
  .view-switch {
    display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
    background: var(--surface-1);
  }
  .view-switch button {
    border: none; background: none; color: var(--text-secondary); font-size: 13px;
    padding: 6px 12px; cursor: pointer;
  }
  .view-switch button + button { border-left: 1px solid var(--border); }
  .view-switch button[aria-pressed="true"] { background: var(--seq-100); color: var(--text-primary); }
  .band-divider { stroke: var(--baseline); stroke-width: 1; stroke-dasharray: 4 4; }

  svg { display: block; overflow: visible; }
  .gridline { stroke: var(--gridline); stroke-width: 1; }
  .baseline { stroke: var(--baseline); stroke-width: 1; }
  .axis-label { fill: var(--text-muted); font-size: 10px; font-variant-numeric: tabular-nums; }
  .crosshair { stroke: var(--text-muted); stroke-width: 1; stroke-dasharray: 2 2; pointer-events: none; }
  /* Halo in the surface color keeps labels readable where they cross lines. */
  .point-label {
    font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums;
    stroke: var(--surface-1); stroke-width: 3px; stroke-linejoin: round; paint-order: stroke;
    pointer-events: none;
  }

  #chart-stack { position: relative; }
  #tooltip {
    position: absolute; pointer-events: none; background: var(--surface-1);
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px;
    font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.15); white-space: nowrap;
    opacity: 0; transition: opacity 80ms; z-index: 10;
  }
  #tooltip .t-time { color: var(--text-secondary); margin-bottom: 4px; }
  #tooltip .t-row { display:flex; gap: 8px; align-items:center; }
  #tooltip .t-key { width: 10px; height: 2px; border-radius: 2px; }
  #tooltip .t-val { font-weight: 600; font-variant-numeric: tabular-nums; }
  #tooltip .t-name { color: var(--text-secondary); }

  .table-toggle {
    background: none; border: 1px solid var(--border); color: var(--text-secondary);
    border-radius: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer; margin: 8px 0 16px;
  }
  #table-wrap { display: none; max-height: 360px; overflow: auto; border: 1px solid var(--border); border-radius: 10px; }
  table { border-collapse: collapse; width: 100%; font-size: 12px; font-variant-numeric: tabular-nums; }
  th, td { padding: 6px 10px; text-align: right; border-bottom: 1px solid var(--gridline); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th { position: sticky; top: 0; z-index: 1; background: var(--surface-1); color: var(--text-secondary); font-weight: 600; vertical-align: bottom; box-shadow: inset 0 -1px 0 var(--border); }
  th .th-name { display: flex; align-items: center; justify-content: flex-end; gap: 6px; }
  th:first-child .th-name { justify-content: flex-start; }
  th .th-unit { color: var(--text-muted); font-weight: 400; font-size: 11px; }
  th .swatch { width: 10px; height: 2px; border-radius: 2px; flex: none; }
  tbody tr:hover td { background: var(--gridline); }
  td.deco { color: var(--status-critical); }
  td.active-tank { font-weight: 600; }
  tr.switch-row td {
    text-align: left; color: var(--text-secondary); font-size: 11px; font-weight: 600;
    background: var(--gridline); border-top: 1px solid var(--border);
  }

  #status { color: var(--text-secondary); font-size: 13px; }

  .map-container { height: 260px; border-radius: 8px; overflow: hidden; }
  /* Dark mode: invert the OSM raster tiles (not the marker) and darken the controls and popup. */
  .map-container.leaflet-container { background: var(--map-bg, #ddd); }
  .map-container .leaflet-tile-pane { filter: var(--map-tile-filter, none); }
  :root[data-theme="dark"] .map-container .leaflet-bar a,
  :root[data-theme="dark"] .map-container .leaflet-control-attribution,
  :root[data-theme="dark"] .map-container .leaflet-popup-content-wrapper,
  :root[data-theme="dark"] .map-container .leaflet-popup-tip { background: var(--surface-1); color: var(--text-secondary); border-color: var(--baseline); }
  :root[data-theme="dark"] .map-container .leaflet-control-attribution a { color: var(--series-1); }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .map-container .leaflet-bar a,
    :root:where(:not([data-theme="light"])) .map-container .leaflet-control-attribution,
    :root:where(:not([data-theme="light"])) .map-container .leaflet-popup-content-wrapper,
    :root:where(:not([data-theme="light"])) .map-container .leaflet-popup-tip { background: var(--surface-1); color: var(--text-secondary); border-color: var(--baseline); }
    :root:where(:not([data-theme="light"])) .map-container .leaflet-control-attribution a { color: var(--series-1); }
  }
</style>
</head>
<body>
<div class="viz-root" id="root">
  <div class="header">
    <div>
      <h1 id="dive-title">Loading dive…</h1>
      <div class="sub" id="dive-sub"></div>
    </div>
    <button class="theme-toggle" id="theme-toggle" type="button">Toggle theme</button>
  </div>

  <div id="status"></div>
  <div class="stats" id="stats"></div>
  <div class="chart-toolbar">
    <div class="view-switch" id="view-switch" role="group" aria-label="Chart layout">
      <button type="button" data-view="combined">Combined</button>
      <button type="button" data-view="separate">Separate</button>
    </div>
  </div>
  <div id="chart-stack"></div>
  <div id="map-panel"></div>
  <button class="table-toggle" id="table-toggle" type="button">Show data table</button>
  <div id="table-wrap"><table id="table"></table></div>
  <div id="tooltip"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function () {
  const root = document.getElementById("root");
  const themeBtn = document.getElementById("theme-toggle");
  themeBtn.addEventListener("click", () => {
    const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    const cur = document.documentElement.getAttribute("data-theme") || (prefersDark ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", cur === "dark" ? "light" : "dark");
  });

  const statusEl = document.getElementById("status");
  const tooltip = document.getElementById("tooltip");
  const stackEl = document.getElementById("chart-stack");

  const DEFAULT_MARGIN = { top: 8, right: 16, bottom: 20, left: 44 };
  // The combined chart needs room on the right for its banded scales' ticks.
  const COMBINED_MARGIN = { ...DEFAULT_MARGIN, right: 60 };

  function svgEl(tag, attrs) {
    const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
    for (const k in attrs) el.setAttribute(k, attrs[k]);
    return el;
  }

  // Standard gas name for an open-circuit mix given O2/He percentages.
  function mixName(o2, he) {
    if (o2 === null || o2 === undefined) return null;
    if (he > 0) return `Tx ${o2}/${he}`;
    if (o2 === 21) return "Air";
    if (o2 === 100) return "O2";
    return `EAN${o2}`;
  }

  // Display labels per tank slot, e.g. { name: "D1", mix: "EAN56", full: "EAN56 (D1)" }.
  // Falls back to "Tank N" for dives parsed before tank names were recorded.
  function tankLabelsFor(dive) {
    return [0, 1, 2, 3].map((i) => {
      const t = (dive.tanks || [])[i];
      const name = (t && t.name) || `Tank ${i + 1}`;
      const mix = t ? mixName(t.o2Percent, t.hePercent) : null;
      return { name, mix, full: mix ? `${mix} (${name})` : name };
    });
  }

  function fmtTime(sec) {
    sec = Math.round(sec);
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return m + ":" + String(s).padStart(2, "0");
  }

  // ---- scale helpers ----
  function makeScale(domain, range) {
    const [d0, d1] = domain, [r0, r1] = range;
    return (v) => r0 + ((v - d0) / (d1 - d0 || 1)) * (r1 - r0);
  }

  function niceTicks(min, max, count) {
    const span = max - min || 1;
    const rawStep = span / count;
    const mag = Math.pow(10, Math.floor(Math.log10(rawStep)));
    const norm = rawStep / mag;
    let step;
    if (norm < 1.5) step = 1 * mag;
    else if (norm < 3) step = 2 * mag;
    else if (norm < 7) step = 5 * mag;
    else step = 10 * mag;
    const start = Math.ceil(min / step) * step;
    const ticks = [];
    for (let v = start; v <= max + 1e-9; v += step) ticks.push(Math.round(v * 1000) / 1000);
    return ticks;
  }

  // Detect gas switches from tank pressure trends: at any point in time the
  // diver breathes from exactly one tank, so that tank's pressure drops
  // steadily while the others sit flat (aside from sensor noise). We scan a
  // rolling window per tank looking for a sustained, consistent drop, pick
  // whichever tank has the strongest such drop at each sample, and emit an
  // event wherever that "active tank" changes.
  function detectGasSwitches(samples) {
    const WINDOW = 6;             // ~12s at 2s sampling — long enough to separate a real draw from noise
    const NOISE_TOLERANCE = 0.3;  // bar; small upward blips within this are sensor noise, not a refill
    const MIN_DROP = 1.0;         // bar over the window; minimum drop to count as "in use"
    const MIN_RUN = 6;            // minimum consecutive samples agreeing on the active tank

    const n = samples.length;
    const tankCount = samples[0].tankPressureBar.length;
    const pressure = Array.from({ length: tankCount }, (_, i) => samples.map((s) => s.tankPressureBar[i]));

    const dropping = Array.from({ length: tankCount }, () => new Array(n).fill(false));
    const windowDrop = Array.from({ length: tankCount }, () => new Array(n).fill(0));

    for (let tank = 0; tank < tankCount; tank++) {
      const p = pressure[tank];
      for (let j = 0; j + WINDOW < n; j++) {
        let consistent = true;
        for (let k = j; k < j + WINDOW; k++) {
          const a = p[k], b = p[k + 1];
          if (a === null || b === null || b - a > NOISE_TOLERANCE) { consistent = false; break; }
        }
        if (!consistent) continue;
        const drop = p[j] - p[j + WINDOW];
        windowDrop[tank][j] = drop;
        dropping[tank][j] = drop >= MIN_DROP;
      }
    }

    // Pick the tank with the strongest consistent drop at each sample index.
    const rawBest = new Array(n).fill(-1);
    for (let j = 0; j < n; j++) {
      let best = -1, bestDrop = 0;
      for (let tank = 0; tank < tankCount; tank++) {
        if (dropping[tank][j] && windowDrop[tank][j] > bestDrop) { best = tank; bestDrop = windowDrop[tank][j]; }
      }
      rawBest[j] = best;
    }

    // Collapse into runs of "which tank is active", ignoring indices with no clear answer.
    const runs = [];
    for (let j = 0; j < n; j++) {
      if (rawBest[j] === -1) continue;
      const last = runs[runs.length - 1];
      if (last && last.tank === rawBest[j]) { last.end = j; last.len++; }
      else runs.push({ tank: rawBest[j], start: j, end: j, len: 1 });
    }

    // Discard short runs (noise blips) by folding them into the previous run.
    const filtered = [];
    runs.forEach((r) => {
      if (r.len < MIN_RUN && filtered.length) filtered[filtered.length - 1].end = r.end;
      else filtered.push({ ...r });
    });
    // Re-merge any adjacent runs that ended up sharing the same tank.
    const merged = [];
    filtered.forEach((r) => {
      const last = merged[merged.length - 1];
      if (last && last.tank === r.tank) last.end = r.end;
      else merged.push(r);
    });

    const events = [];
    for (let i = 1; i < merged.length; i++) {
      const index = merged[i].start;
      events.push({ t: samples[index].t, index, fromTank: merged[i - 1].tank + 1, toTank: merged[i].tank + 1 });
    }
    return events;
  }

  // Split the dive into segments at each gas switch and collect the tank
  // pressures worth labelling: the active tank's pressure at the start of the
  // dive, both tanks' pressures at every switch (old tank's end, new tank's
  // start), and every tank's final pressure at the end of the dive.
  function buildPressureLabels(samples, events, { includeSwitches }) {
    const n = samples.length;
    const tankCount = samples[0].tankPressureBar.length;
    const at = (tank, i) => samples[i].tankPressureBar[tank];

    // Nearest non-null reading for a tank, searching backward or forward from
    // an index — tanks paired mid-dive have no readings before their first report.
    function reading(tank, from, dir) {
      for (let i = from; i >= 0 && i < n; i += dir) {
        const v = at(tank, i);
        if (v !== null && v !== undefined) return { index: i, v };
      }
      return null;
    }

    let firstTank;
    if (events.length) {
      firstTank = events[0].fromTank - 1;
    } else {
      // No switches: the active tank is whichever one dropped the most.
      let bestDrop = -Infinity;
      for (let tank = 0; tank < tankCount; tank++) {
        const first = reading(tank, 0, 1), last = reading(tank, n - 1, -1);
        if (first && last && first.v - last.v > bestDrop) { bestDrop = first.v - last.v; firstTank = tank; }
      }
    }

    const labels = [];
    const push = (tank, r, side) => {
      if (r) labels.push({ tank, t: samples[r.index].t, v: r.v, side });
    };

    if (firstTank !== undefined) push(firstTank, reading(firstTank, 0, 1), "right");

    if (includeSwitches) {
      events.forEach((e) => {
        push(e.fromTank - 1, reading(e.fromTank - 1, Math.max(0, e.index - 1), -1), "left");
        push(e.toTank - 1, reading(e.toTank - 1, e.index, 1), "right");
      });
    } else {
      // Every tank other than the first gets its starting pressure labelled at
      // the first switch onto it — the point where it's first used.
      const labelled = new Set([firstTank]);
      events.forEach((e) => {
        const tank = e.toTank - 1;
        if (labelled.has(tank)) return;
        labelled.add(tank);
        push(tank, reading(tank, e.index, 1), "right");
      });
    }

    for (let tank = 0; tank < tankCount; tank++) push(tank, reading(tank, n - 1, -1), "left");

    return labels;
  }

  // Draw value labels next to their points, nudging each one vertically until
  // it clears every label placed before it (and any fixed obstacles such as
  // gas switch markers). Displaced labels get a thin leader back to their dot.
  function drawPointLabels(svg, labels, { xScale, yScale, top, bottom, obstacles }) {
    const GAP = 6, PAD = 2, STEP = 2;
    const placed = (obstacles || []).slice();
    const overlaps = (a, b) =>
      a.x < b.x + b.w + PAD && b.x < a.x + a.w + PAD && a.y < b.y + b.h + PAD && b.y < a.y + a.h + PAD;

    // Dots first, so they sit under every label and count as obstacles.
    labels.forEach((l) => {
      l.px = xScale(l.t);
      l.py = yScale(l.v);
      svg.appendChild(svgEl("circle", {
        cx: l.px, cy: l.py, r: 3, fill: l.color, stroke: "var(--surface-1)", "stroke-width": 1.5,
      }));
      placed.push({ x: l.px - 3, y: l.py - 3, w: 6, h: 6, owner: l });
    });

    labels.forEach((l) => {
      const text = svgEl("text", {
        class: "point-label", fill: l.color,
        x: l.side === "left" ? l.px - GAP : l.px + GAP,
        "text-anchor": l.side === "left" ? "end" : "start",
        "dominant-baseline": "central",
      });
      text.textContent = l.text;
      svg.appendChild(text);
      const box = text.getBBox();
      const h = box.height, w = box.width;
      const x = l.side === "left" ? l.px - GAP - w : l.px + GAP;
      const minY = top + h / 2, maxY = bottom - h / 2;
      const clamp = (y) => Math.min(maxY, Math.max(minY, y));
      // The label's own dot is right beside it; ignore it when testing.
      const others = placed.filter((p) => p.owner !== l);

      // Try the point's own height first, then step outward alternately up
      // and down; if nothing is free, fall back to the point's height.
      const start = clamp(l.py);
      let y = start;
      const reach = Math.max(start - minY, maxY - start);
      for (let d = 0; d <= reach; d += STEP) {
        const free = [start - d, start + d].find((cy) =>
          cy >= minY && cy <= maxY && !others.some((p) => overlaps({ x, y: cy - h / 2, w, h }, p)));
        if (free !== undefined) { y = free; break; }
      }

      text.setAttribute("y", y);
      placed.push({ x, y: y - h / 2, w, h });
      if (Math.abs(y - l.py) > 3) {
        const edgeX = l.side === "left" ? l.px - GAP + 2 : l.px + GAP - 2;
        svg.insertBefore(svgEl("line", {
          x1: l.px, y1: l.py, x2: edgeX, y2: y,
          stroke: l.color, "stroke-width": 1, opacity: 0.7,
        }), text);
      }
    });
  }

  // Panel registry so the shared crosshair can update every chart at once.
  const panels = [];

  // Series, point labels and right-hand axes may each claim a horizontal
  // slice of the plot (`band`: [top, bottom] as fractions of the plot height)
  // with their own value domain, so several units can share one chart. Anything
  // without a band uses the panel's own y-domain across the full height.
  function drawPanel({ title, legendItems, height, width, xDomain, series, yDomain, yFmt, invertY, bands, markers, pointLabels, pointLabelScale, rightAxes, dividers, toggle, margin, peaks }) {
    const MARGIN = margin || DEFAULT_MARGIN;
    const w = width, h = height;
    const innerW = w - MARGIN.left - MARGIN.right;
    const innerH = h - MARGIN.top - MARGIN.bottom;
    const bandTop = (f) => MARGIN.top + f * innerH;
    function scaleFor(spec) {
      if (!spec || !spec.band) return yScale;
      const [top, bottom] = spec.band.map(bandTop);
      return makeScale(spec.domain, spec.invert ? [top, bottom] : [bottom, top]);
    }

    const panelDiv = document.createElement("div");
    panelDiv.className = "panel";

    const titleRow = document.createElement("div");
    titleRow.className = "panel-title";
    const titleSpan = document.createElement("span");
    titleSpan.textContent = title;
    titleRow.appendChild(titleSpan);
    if ((legendItems && legendItems.length > 1) || toggle) {
      const controls = document.createElement("div");
      controls.className = "panel-controls";
      if (legendItems && legendItems.length > 1) {
        const legend = document.createElement("div");
        legend.className = "legend";
        legendItems.forEach((li) => {
          const key = document.createElement("span");
          key.className = "key";
          const sw = document.createElement("span");
          sw.className = "swatch";
          sw.style.background = li.dashed
            ? `repeating-linear-gradient(90deg, ${li.color} 0 4px, transparent 4px 7px)`
            : li.color;
          const label = document.createElement("span");
          label.textContent = li.name;
          key.appendChild(sw);
          key.appendChild(label);
          legend.appendChild(key);
        });
        controls.appendChild(legend);
      }
      if (toggle) {
        const toggleLabel = document.createElement("label");
        toggleLabel.className = "panel-toggle";
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = toggle.checked;
        checkbox.addEventListener("change", () => toggle.onChange(checkbox.checked));
        const text = document.createElement("span");
        text.textContent = toggle.label;
        toggleLabel.appendChild(checkbox);
        toggleLabel.appendChild(text);
        controls.appendChild(toggleLabel);
      }
      titleRow.appendChild(controls);
    }
    panelDiv.appendChild(titleRow);

    const svg = svgEl("svg", {
      viewBox: `0 0 ${w} ${h}`, preserveAspectRatio: "none",
      style: `width:100%; height:${h}px; display:block;`,
    });
    panelDiv.appendChild(svg);
    stackEl.appendChild(panelDiv);

    const xScale = makeScale(xDomain, [MARGIN.left, MARGIN.left + innerW]);
    const yRange = invertY ? [MARGIN.top, MARGIN.top + innerH] : [MARGIN.top + innerH, MARGIN.top];
    const yScale = makeScale(yDomain, yRange);

    // gridlines (y)
    const yTicks = niceTicks(yDomain[0], yDomain[1], 4);
    yTicks.forEach((tv) => {
      const y = yScale(tv);
      svg.appendChild(svgEl("line", { x1: MARGIN.left, x2: w - MARGIN.right, y1: y, y2: y, class: "gridline" }));
      const label = svgEl("text", { x: MARGIN.left - 8, y: y + 3, class: "axis-label", "text-anchor": "end" });
      label.textContent = yFmt ? yFmt(tv) : tv;
      svg.appendChild(label);
    });

    // band dividers, marking where each banded scale's slice begins/ends
    (dividers || []).forEach((f) => {
      const y = bandTop(f);
      svg.appendChild(svgEl("line", { x1: MARGIN.left, x2: w - MARGIN.right, y1: y, y2: y, class: "band-divider" }));
    });

    // right-hand tick labels for banded scales
    (rightAxes || []).forEach((a) => {
      const scale = scaleFor(a);
      niceTicks(a.domain[0], a.domain[1], a.ticks || 3).forEach((tv) => {
        const label = svgEl("text", {
          x: w - MARGIN.right + 8, y: scale(tv) + 3, class: "axis-label", "text-anchor": "start",
        });
        label.textContent = a.fmt ? a.fmt(tv) : tv;
        svg.appendChild(label);
      });
    });

    // shaded bands (e.g. deco ceiling zone)
    (bands || []).forEach((b) => {
      const path = b.points.map((p, i) => `${i === 0 ? "M" : "L"}${xScale(p.t)},${yScale(p.v)}`).join(" ");
      const baseY = yScale(b.base);
      const first = b.points[0], last = b.points[b.points.length - 1];
      const d = `${path} L${xScale(last.t)},${baseY} L${xScale(first.t)},${baseY} Z`;
      svg.appendChild(svgEl("path", { d, fill: b.color, opacity: b.opacity || 0.18, stroke: "none" }));
    });

    // series lines
    const seriesScales = series.map(scaleFor);
    series.forEach((s, si) => {
      const sScale = seriesScales[si];
      let d = "";
      let penDown = false;
      s.points.forEach((p) => {
        if (p.v === null || p.v === undefined) { penDown = false; return; }
        const x = xScale(p.t), y = sScale(p.v);
        d += (penDown ? "L" : "M") + x + "," + y + " ";
        penDown = true;
      });
      svg.appendChild(svgEl("path", {
        d, fill: "none", stroke: s.color, "stroke-width": s.width || 2,
        "stroke-linejoin": "round", "stroke-linecap": "round",
        "stroke-dasharray": s.dashed ? "4 3" : null,
      }));
    });

    // gas switch markers (or similar point-in-time indicators)
    (markers || []).forEach((m) => {
      const x = xScale(m.t);
      svg.appendChild(svgEl("line", {
        x1: x, x2: x, y1: MARGIN.top, y2: MARGIN.top + innerH,
        stroke: "var(--text-secondary)", "stroke-width": 1, "stroke-dasharray": "3 3", opacity: 0.6,
      }));
      svg.appendChild(svgEl("path", {
        d: `M${x - 4},${MARGIN.top} L${x + 4},${MARGIN.top} L${x},${MARGIN.top + 7} Z`,
        fill: "var(--text-secondary)", opacity: 0.85,
      }));
    });

    if (pointLabels && pointLabels.length) {
      // Gas switch triangles at the top of the plot are obstacles for labels.
      const obstacles = (markers || []).map((m) => ({ x: xScale(m.t) - 4, y: MARGIN.top, w: 8, h: 7 }));
      const band = (pointLabelScale && pointLabelScale.band) || [0, 1];
      drawPointLabels(svg, pointLabels, {
        xScale, yScale: scaleFor(pointLabelScale), top: bandTop(band[0]), bottom: bandTop(band[1]), obstacles,
      });
    }

    // point markers (max depth, SurfGF): a dot on the sample with its value
    // labelled just below, centred or to the right, kept inside the plot horizontally.
    (peaks || []).forEach((peak) => {
      const px = xScale(peak.t), py = yScale(peak.v);
      svg.appendChild(svgEl("circle", {
        cx: px, cy: py, r: 3.5, fill: peak.color, stroke: "var(--surface-1)", "stroke-width": 1.5,
      }));
      const text = svgEl("text", {
        class: "point-label", fill: peak.color, x: peak.align === "start" ? px + 5 : px, y: py + 7,
        "text-anchor": peak.align || "middle", "dominant-baseline": "hanging",
      });
      text.textContent = peak.text;
      svg.appendChild(text);
      const box = text.getBBox();
      const shift = Math.max(MARGIN.left - box.x, 0) + Math.min(w - MARGIN.right - (box.x + box.width), 0);
      if (shift) text.setAttribute("x", Number(text.getAttribute("x")) + shift);
    });

    // baseline
    svg.appendChild(svgEl("line", {
      x1: MARGIN.left, x2: w - MARGIN.right,
      y1: yRange[invertY ? 0 : 1] === yRange[0] ? MARGIN.top + innerH : MARGIN.top,
      y2: yRange[invertY ? 0 : 1] === yRange[0] ? MARGIN.top + innerH : MARGIN.top,
      class: "baseline",
    }));

    const crosshair = svgEl("line", {
      x1: 0, x2: 0, y1: MARGIN.top, y2: MARGIN.top + innerH, class: "crosshair", visibility: "hidden",
    });
    svg.appendChild(crosshair);
    const dots = series.map((s) => {
      const c = svgEl("circle", { r: 3.5, fill: s.color, stroke: "var(--surface-1)", "stroke-width": 1.5, visibility: "hidden" });
      svg.appendChild(c);
      return c;
    });

    panels.push({ xScale, seriesScales, crosshair, dots, series, innerW, w, svg, margin: MARGIN });

    return panelDiv;
  }

  function drawXAxis(width, xDomain, margin) {
    const MARGIN = margin || DEFAULT_MARGIN;
    const h = 26;
    const svg = svgEl("svg", {
      viewBox: `0 0 ${width} ${h}`, preserveAspectRatio: "none",
      style: `width:100%; height:${h}px; display:block;`,
    });
    const xScale = makeScale(xDomain, [MARGIN.left, width - MARGIN.right]);
    const ticks = niceTicks(xDomain[0], xDomain[1], 8);
    ticks.forEach((tv) => {
      const x = xScale(tv);
      const label = svgEl("text", { x, y: 12, class: "axis-label", "text-anchor": "middle" });
      label.textContent = fmtTime(tv);
      svg.appendChild(label);
    });
    const wrap = document.createElement("div");
    wrap.style.marginBottom = "8px";
    wrap.appendChild(svg);
    stackEl.appendChild(wrap);
  }

  function setupCrosshair(samples, width, xDomain, gasSwitchEvents, colors, tankLabels) {
    const MARGIN = panels[0].margin;
    stackEl.style.position = "relative";
    const overlay = svgEl("svg", { width, height: 2, style: "position:absolute; top:0; left:0; pointer-events:none;" });
    // Use a transparent full-height div for pointer capture instead of svg overlay,
    // since panels have varying heights.
    // Position/size the capture area from the first panel's actual rendered
    // box rather than its nominal SVG width — the panel's own CSS padding
    // makes the SVG (preserveAspectRatio="none") render a bit narrower than
    // its viewBox, so trusting the nominal width here drifts the mouse-to-time
    // mapping away from where the chart is actually drawn.
    const p0Rect = panels[0].svg.getBoundingClientRect();
    const stackRect = stackEl.getBoundingClientRect();
    const scaleX = p0Rect.width / panels[0].w;
    const plotLeft = p0Rect.left - stackRect.left + MARGIN.left * scaleX;
    const plotWidth = panels[0].innerW * scaleX;

    const capture = document.createElement("div");
    capture.style.position = "absolute";
    capture.style.top = "0";
    capture.style.left = plotLeft + "px";
    capture.style.width = plotWidth + "px";
    capture.style.height = stackEl.scrollHeight + "px";
    capture.style.cursor = "crosshair";
    capture.style.zIndex = "1";
    stackEl.style.position = "relative";
    stackEl.appendChild(capture);

    const xScale = panels[0].xScale;

    function nearestIndex(t) {
      let lo = 0, hi = samples.length - 1;
      while (lo < hi) {
        const mid = (lo + hi) >> 1;
        if (samples[mid].t < t) lo = mid + 1; else hi = mid;
      }
      return lo;
    }

    function move(evt) {
      const rect = capture.getBoundingClientRect();
      const frac = (evt.clientX - rect.left) / rect.width;
      const t = frac * (xDomain[1] - xDomain[0]) + xDomain[0];
      const idx = Math.max(0, Math.min(samples.length - 1, nearestIndex(t)));
      const s = samples[idx];
      const x = xScale(s.t);

      panels.forEach((p) => {
        p.crosshair.setAttribute("x1", x);
        p.crosshair.setAttribute("x2", x);
        p.crosshair.setAttribute("visibility", "visible");
        p.series.forEach((ser, i) => {
          const v = ser.points[idx] ? ser.points[idx].v : null;
          const dot = p.dots[i];
          if (v === null || v === undefined) { dot.setAttribute("visibility", "hidden"); return; }
          dot.setAttribute("cx", x);
          dot.setAttribute("cy", p.seriesScales[i](v));
          dot.setAttribute("visibility", "visible");
        });
      });

      // tooltip content
      tooltip.innerHTML = "";
      const timeRow = document.createElement("div");
      timeRow.className = "t-time";
      timeRow.textContent = fmtTime(s.t) + " elapsed";
      tooltip.appendChild(timeRow);
      const rowsData = [
        ["Depth", s.depth, "m", colors.depth],
        ["Ceiling", s.firstStopDepth, "m", "var(--status-critical)"],
        ["NDL", s.ndlMin, "min", "var(--text-muted)"],
        ["PPO2", s.ppo2, "atm", colors.ppo2],
        ["Temp", s.waterTempC, "°C", colors.temp],
        ...s.tankPressureBar.map((v, i) => [tankLabels[i].full, v, "bar", colors.tanks[i]]),
      ];
      rowsData.forEach(([name, val, unit, color]) => {
        if (val === null || val === undefined) return;
        const row = document.createElement("div");
        row.className = "t-row";
        const key = document.createElement("span");
        key.className = "t-key";
        key.style.background = color;
        const valSpan = document.createElement("span");
        valSpan.className = "t-val";
        valSpan.textContent = (typeof val === "number" ? (Number.isInteger(val) ? val : val.toFixed(2)) : val) + " " + unit;
        const nameSpan = document.createElement("span");
        nameSpan.className = "t-name";
        nameSpan.textContent = name;
        row.appendChild(key);
        row.appendChild(valSpan);
        row.appendChild(nameSpan);
        tooltip.appendChild(row);
      });

      const nearestSwitch = (gasSwitchEvents || [])
        .map((e) => ({ e, dist: Math.abs(e.index - idx) }))
        .sort((a, b) => a.dist - b.dist)[0];
      if (nearestSwitch && nearestSwitch.dist <= 3) {
        const row = document.createElement("div");
        row.className = "t-row";
        const valSpan = document.createElement("span");
        valSpan.className = "t-val";
        const from = tankLabels[nearestSwitch.e.fromTank - 1], to = tankLabels[nearestSwitch.e.toTank - 1];
        valSpan.textContent = `Gas switch: ${from.full} → ${to.full}`;
        row.appendChild(valSpan);
        tooltip.appendChild(row);
      }

      const stackRect = stackEl.getBoundingClientRect();
      let left = x + 12;
      if (left + 180 > stackEl.clientWidth) left = x - 190;
      tooltip.style.left = left + "px";
      tooltip.style.top = (evt.clientY - stackRect.top - 10) + "px";
      tooltip.style.opacity = "1";
    }

    capture.addEventListener("mousemove", move);
    capture.addEventListener("mouseleave", () => {
      tooltip.style.opacity = "0";
      panels.forEach((p) => {
        p.crosshair.setAttribute("visibility", "hidden");
        p.dots.forEach((d) => d.setAttribute("visibility", "hidden"));
      });
    });
  }

  function buildTable(samples, { tankLabels, tanksInUse, gasSwitchEvents, colors }) {
    const table = document.getElementById("table");
    const blank = (v) => v === null || v === undefined;
    const fixed = (dp) => (v) => (blank(v) ? "–" : v.toFixed(dp));

    // Which tank is being breathed at each sample, from the detected gas switches.
    const firstTank = gasSwitchEvents.length ? gasSwitchEvents[0].fromTank - 1 : null;
    const activeTank = (index) => {
      let tank = firstTank;
      gasSwitchEvents.forEach((e) => { if (e.index <= index) tank = e.toTank - 1; });
      return tank;
    };

    const cols = [
      { name: "Time", value: (s) => fmtTime(s.t) },
      { name: "Depth", unit: "m", value: (s) => fixed(1)(s.depth) },
      {
        name: "Ceiling", unit: "m",
        value: (s) => (s.firstStopDepth > 0 ? String(s.firstStopDepth) : "–"),
        className: (s) => (s.firstStopDepth > 0 ? "deco" : ""),
      },
      {
        // NDL reads 0 both at the surface and in deco; show which one it is.
        name: "NDL", unit: "min",
        value: (s) => (s.firstStopDepth > 0 ? "Deco" : s.ndlMin > 0 ? String(s.ndlMin) : "–"),
        className: (s) => (s.firstStopDepth > 0 ? "deco" : ""),
      },
      { name: "PPO2", unit: "atm", value: (s) => fixed(2)(s.ppo2) },
      { name: "Temp", unit: "°C", value: (s) => fixed(0)(s.waterTempC) },
      ...tanksInUse.map((i) => ({
        name: tankLabels[i].full, unit: "bar", color: colors.tanks[i],
        value: (s) => fixed(0)(s.tankPressureBar[i]),
        className: (s, index) => (activeTank(index) === i ? "active-tank" : ""),
        style: (s, index) => (activeTank(index) === i ? colors.tanks[i] : null),
      })),
    ];

    const thead = document.createElement("thead");
    const trh = document.createElement("tr");
    cols.forEach((c) => {
      const th = document.createElement("th");
      const name = document.createElement("div");
      name.className = "th-name";
      if (c.color) {
        const swatch = document.createElement("span");
        swatch.className = "swatch";
        swatch.style.background = c.color;
        name.appendChild(swatch);
      }
      name.appendChild(document.createTextNode(c.name));
      th.appendChild(name);
      const unit = document.createElement("div");
      unit.className = "th-unit";
      unit.textContent = c.unit || "\u00a0";
      th.appendChild(unit);
      trh.appendChild(th);
    });
    thead.appendChild(trh);
    table.appendChild(thead);

    const tbody = document.createElement("tbody");
    const addSampleRow = (s, index) => {
      const tr = document.createElement("tr");
      cols.forEach((c) => {
        const td = document.createElement("td");
        td.textContent = c.value(s, index);
        const cls = c.className && c.className(s, index);
        if (cls) td.className = cls;
        const color = c.style && c.style(s, index);
        if (color) td.style.color = color;
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    };
    const addSwitchRow = (e) => {
      const tr = document.createElement("tr");
      tr.className = "switch-row";
      const td = document.createElement("td");
      td.colSpan = cols.length;
      const from = tankLabels[e.fromTank - 1].full, to = tankLabels[e.toTank - 1].full;
      td.textContent = `${fmtTime(e.t)} · Gas switch: ${from} → ${to}`;
      tr.appendChild(td);
      tbody.appendChild(tr);
    };

    // Sample every 6th row (12s) to keep the table reasonably sized, plus a
    // marker row and the exact sample at each gas switch.
    const switchesAt = new Map(gasSwitchEvents.map((e) => [e.index, e]));
    samples.forEach((s, i) => {
      if (switchesAt.has(i)) {
        addSwitchRow(switchesAt.get(i));
        addSampleRow(s, i);
      } else if (i % 6 === 0) {
        addSampleRow(s, i);
      }
    });
    table.appendChild(tbody);
  }

  function renderMap(dive) {
    const coords = dive.coordinates;
    if (!coords || coords.lat == null || coords.lon == null) return;

    const panelDiv = document.createElement("div");
    panelDiv.className = "panel";
    const titleRow = document.createElement("div");
    titleRow.className = "panel-title";
    const titleSpan = document.createElement("span");
    titleSpan.textContent = "Dive location";
    titleRow.appendChild(titleSpan);
    panelDiv.appendChild(titleRow);

    const mapEl = document.createElement("div");
    mapEl.className = "map-container";
    panelDiv.appendChild(mapEl);
    document.getElementById("map-panel").appendChild(panelDiv);

    const map = L.map(mapEl).setView([coords.lat, coords.lon], 12);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    }).addTo(map);
    L.marker([coords.lat, coords.lon]).addTo(map)
      .bindPopup(dive.site || "Dive site")
      .openPopup();
  }

  async function main() {
    statusEl.textContent = "Loading dive data…";
    let index;
    try {
      index = await fetch("../data/dives.json").then((r) => r.json());
    } catch (e) {
      statusEl.textContent = "Could not load ../data/dives.json — serve this folder over http:// (see README).";
      return;
    }
    if (!index.length) {
      statusEl.textContent = "No dives found in data/dives.json.";
      return;
    }
    const first = index[0];
    const dive = await fetch("../data/" + first.file).then((r) => r.json());
    statusEl.textContent = "";

    document.getElementById("dive-title").textContent =
      `Dive #${dive.diveNumber} — ${dive.site || "Unknown site"}`;
    document.getElementById("dive-sub").textContent =
      [dive.startDate, dive.location, dive.buddy ? "Buddy: " + dive.buddy : null]
        .filter(Boolean).join(" · ");

    const samples = dive.samples;
    const tankLabels = tankLabelsFor(dive);
    const temps = samples.map((s) => s.waterTempC).filter((v) => v !== null);
    const avgTemp = temps.reduce((a, b) => a + b, 0) / temps.length;

    const stats = document.getElementById("stats");
    const statData = [
      ["Max depth", dive.maxDepthM, "m"],
      ["Dive time", fmtTime(dive.maxTimeSec), ""],
      ["Avg temp", avgTemp.toFixed(1), "°C"],
      ["Min temp", Math.min(...temps), "°C"],
      ["GF", `${dive.gfMin}/${dive.gfMax}`, ""],
      ["Deco time", fmtTime(samples.filter((s) => s.firstStopDepth > 0).length * 2), ""],
    ];
    statData.forEach(([label, value, unit]) => {
      const el = document.createElement("div");
      el.className = "stat";
      el.innerHTML = `<div class="label"></div><div class="value"></div>`;
      el.querySelector(".label").textContent = label;
      const valEl = el.querySelector(".value");
      valEl.textContent = value + " ";
      const unitEl = document.createElement("span");
      unitEl.className = "unit";
      unitEl.textContent = unit;
      valEl.appendChild(unitEl);
      stats.appendChild(el);
    });

    const xDomain = [samples[0].t, samples[samples.length - 1].t];
    const gasSwitchEvents = detectGasSwitches(samples);
    let showGasSwitches = true;

    const viewSwitch = document.getElementById("view-switch");
    let chartView = "combined";
    try { if (localStorage.getItem("divelog.chartView") === "separate") chartView = "separate"; } catch (e) {}
    function syncViewSwitch() {
      viewSwitch.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.view === chartView)));
    }
    syncViewSwitch();
    viewSwitch.addEventListener("click", (evt) => {
      const view = evt.target.closest("button")?.dataset.view;
      if (!view || view === chartView) return;
      chartView = view;
      try { localStorage.setItem("divelog.chartView", view); } catch (e) {}
      syncViewSwitch();
      renderCharts();
    });

    const DEPTH_HEIGHT = 264;
    const depthMax = Math.max(...samples.map((s) => s.depth || 0)) * 1.08;
    const tankMax = Math.max(...samples.flatMap((s) => s.tankPressureBar.filter((v) => v !== null))) * 1.05;
    const tempDomain = [Math.min(...temps) - 1, Math.max(...temps) + 1];
    // Series colors are shared by both views so each one reads the same in
    // either layout. Tanks: blue, red, yellow, green.
    const COLORS = {
      depth: "var(--depth-line)",
      ppo2: "var(--series-5)",
      temp: "var(--text-muted)",
      tanks: ["var(--series-1)", "var(--series-2)", "var(--series-4)", "var(--series-3)"],
    };
    const tanksInUse = [0, 1, 2, 3].filter((i) => samples.some((s) => s.tankPressureBar[i] !== null));
    const decoBand = {
      points: samples.map((s) => ({ t: s.t, v: s.firstStopDepth || 0 })),
      base: 0,
      color: "var(--status-critical)",
      opacity: 0.16,
    };
    const pointsOf = (fn) => samples.map((s) => ({ t: s.t, v: fn(s) }));
    const deepest = samples.reduce((a, b) => ((b.depth || 0) > (a.depth || 0) ? b : a));
    const maxDepthPeak = {
      t: deepest.t, v: deepest.depth, color: COLORS.depth, text: `Max ${deepest.depth.toFixed(1)} m`,
    };
    // EndGF99 from Shearwater Cloud, marked where the diver reaches the surface
    // (the first zero-depth sample after the last one underwater).
    const lastUnderwater = samples.map((s) => s.depth > 0).lastIndexOf(true);
    const surfacing = samples[Math.min(lastUnderwater + 1, samples.length - 1)];
    const endGf99Marker = dive.endGf99 != null && {
      t: surfacing.t, v: surfacing.depth, color: COLORS.depth, align: "start", text: `SurfGF ${dive.endGf99}%`,
    };
    const gasSwitchToggle = () => ({
      label: "Show gas switches",
      checked: showGasSwitches,
      onChange: (checked) => { showGasSwitches = checked; renderCharts(); },
    });
    const pressureLabelsFor = () =>
      buildPressureLabels(samples, gasSwitchEvents, { includeSwitches: showGasSwitches })
        .map((l) => ({ ...l, color: COLORS.tanks[l.tank], text: `${Math.round(l.v)} bar` }));

    function renderSeparate(width) {
      // Depth panel with deco-ceiling band
      drawPanel({
        title: "Depth",
        height: DEPTH_HEIGHT,
        width,
        xDomain,
        yDomain: [0, depthMax],
        invertY: true,
        yFmt: (v) => v + "m",
        bands: [decoBand],
        peaks: [maxDepthPeak, endGf99Marker].filter(Boolean),
        series: [{ name: "Depth", color: COLORS.depth, points: pointsOf((s) => s.depth) }],
      });

      // Tank pressure panel (only tanks that have any data)
      const tankSeries = tanksInUse.map((i) => ({
        name: tankLabels[i].full, color: COLORS.tanks[i], points: pointsOf((s) => s.tankPressureBar[i]),
      }));
      drawPanel({
        title: "Tank pressure",
        legendItems: tankSeries.map((s) => ({ name: s.name, color: s.color })),
        height: 280,
        width,
        xDomain,
        yDomain: [0, tankMax],
        yFmt: (v) => Math.round(v) + " bar",
        series: tankSeries,
        markers: showGasSwitches ? gasSwitchEvents : [],
        pointLabels: pressureLabelsFor(),
        toggle: gasSwitchToggle(),
      });

      // PPO2 panel
      drawPanel({
        title: "PPO2",
        height: 156,
        width,
        xDomain,
        yDomain: [0, 1.8],
        yFmt: (v) => v.toFixed(1),
        series: [{ name: "PPO2", color: COLORS.ppo2, points: pointsOf((s) => s.ppo2) }],
      });

      // Water temp panel
      drawPanel({
        title: "Water temperature",
        height: 156,
        width,
        xDomain,
        yDomain: tempDomain,
        yFmt: (v) => v.toFixed(0) + "°",
        series: [{ name: "Temp", color: COLORS.temp, points: pointsOf((s) => s.waterTempC) }],
      });

      drawXAxis(width, xDomain);
      setupCrosshair(samples, width, xDomain, showGasSwitches ? gasSwitchEvents : [], COLORS, tankLabels);
    }

    // One tall chart on the depth axis. Tank pressure is squeezed into the
    // middle half; PPO2 and water temperature split the bottom quarter.
    function renderCombined(width) {
      const pressureScale = { domain: [0, tankMax], band: [0.25, 0.75] };
      const ppo2Scale = { domain: [0, 1.8], band: [0.77, 0.865] };
      const tempScale = { domain: tempDomain, band: [0.885, 1] };

      const series = [
        ...tanksInUse.map((i) => ({
          name: tankLabels[i].full, color: COLORS.tanks[i], points: pointsOf((s) => s.tankPressureBar[i]), ...pressureScale,
        })),
        { name: "PPO2", color: COLORS.ppo2, points: pointsOf((s) => s.ppo2), ...ppo2Scale },
        { name: "Temp", color: COLORS.temp, dashed: true, points: pointsOf((s) => s.waterTempC), ...tempScale },
        // Depth last so it draws on top of everything else.
        { name: "Depth", color: COLORS.depth, width: 2, points: pointsOf((s) => s.depth) },
      ];
      const legendOrder = [series[series.length - 1], ...series.slice(0, -1)];

      drawPanel({
        title: "Dive profile",
        legendItems: legendOrder.map((s) => ({ name: s.name, color: s.color, dashed: s.dashed })),
        height: Math.round(DEPTH_HEIGHT * 2.5),
        width,
        margin: COMBINED_MARGIN,
        xDomain,
        yDomain: [0, depthMax],
        invertY: true,
        yFmt: (v) => v + "m",
        bands: [decoBand],
        peaks: [maxDepthPeak, endGf99Marker].filter(Boolean),
        series,
        dividers: [0.25, 0.75, 0.875],
        rightAxes: [
          { ...pressureScale, ticks: 4, fmt: (v) => Math.round(v) + " bar" },
          { ...ppo2Scale, ticks: 3, fmt: (v) => v.toFixed(1) + " atm" },
          { ...tempScale, ticks: 3, fmt: (v) => v.toFixed(0) + "°C" },
        ],
        markers: showGasSwitches ? gasSwitchEvents : [],
        pointLabels: pressureLabelsFor(),
        pointLabelScale: pressureScale,
        toggle: gasSwitchToggle(),
      });

      drawXAxis(width, xDomain, COMBINED_MARGIN);
      setupCrosshair(samples, width, xDomain, showGasSwitches ? gasSwitchEvents : [], COLORS, tankLabels);
    }

    function renderCharts() {
      stackEl.innerHTML = "";
      panels.length = 0;
      const width = Math.min(1048, stackEl.clientWidth || root.clientWidth || 1048);
      if (chartView === "combined") renderCombined(width);
      else renderSeparate(width);
    }

    renderCharts();
    buildTable(samples, { tankLabels, tanksInUse, gasSwitchEvents, colors: COLORS });
    renderMap(dive);

    let resizeTimer = null;
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(renderCharts, 120);
    });

    document.getElementById("table-toggle").addEventListener("click", () => {
      const wrap = document.getElementById("table-wrap");
      const showing = wrap.style.display === "block";
      wrap.style.display = showing ? "none" : "block";
      document.getElementById("table-toggle").textContent = showing ? "Show data table" : "Hide data table";
    });
  }

  main();
})();
</script>
</body>
</html>
