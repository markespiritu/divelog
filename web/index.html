<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Perdix — Dive Log</title>
<script>
  // Apply the saved theme before first paint to avoid a flash of the wrong theme.
  try {
    const t = localStorage.getItem("divelog.theme");
    if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
</script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root {
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --page-plane:     #f9f9f7;
    --text-primary:   #0b0b0b;
    --depth-line:     #3d3c38;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --gridline:       #e1e0d9;
    --baseline:       #c3c2b7;
    --border:         rgba(11,11,11,0.10);
    --series-1:       #2a78d6; /* blue   */
    --series-2:       #eb6834; /* orange */
    --series-3:       #1baf7a; /* aqua   */
    --series-4:       #eda100; /* yellow */
    --series-5:       #8a4fd6; /* violet */
    --series-6:       #e87ba4; /* magenta */
    --status-critical:#d03b3b;
    --status-good:    #0ca30c;
    --seq-100:        #cde2fb;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface-1:      #1a1a19;
      --page-plane:     #0d0d0d;
      --text-primary:   #ffffff;
      --depth-line:     #d6d5cf;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --gridline:       #2c2c2a;
      --baseline:       #383835;
      --border:         rgba(255,255,255,0.10);
      --series-1:       #3987e5;
      --series-2:       #d95926;
      --series-3:       #199e70;
      --series-4:       #c98500;
      --series-5:       #a078ec;
      --series-6:       #d55181;
      --status-critical:#e66767;
      --status-good:    #0ca30c;
      --seq-100:        #184f95;
      --map-tile-filter: invert(1) hue-rotate(180deg) brightness(0.95) contrast(0.9) saturate(0.6);
      --map-bg:         #262624;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-1:      #1a1a19;
    --page-plane:     #0d0d0d;
    --text-primary:   #ffffff;
    --depth-line:     #d6d5cf;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --gridline:       #2c2c2a;
    --baseline:       #383835;
    --border:         rgba(255,255,255,0.10);
    --series-1:       #3987e5;
    --series-2:       #d95926;
    --series-3:       #199e70;
    --series-4:       #c98500;
    --series-5:       #a078ec;
    --series-6:       #d55181;
    --status-critical:#e66767;
    --status-good:    #0ca30c;
    --seq-100:        #184f95;
    --map-tile-filter: invert(1) hue-rotate(180deg) brightness(0.95) contrast(0.9) saturate(0.6);
    --map-bg:         #262624;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--page-plane);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--text-primary);
  }
  .viz-root { padding: 24px; max-width: 1080px; margin: 0 auto; }

  .header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
  .header h1 { font-size: 22px; margin: 0 0 4px; }
  .header .sub { color: var(--text-secondary); font-size: 14px; }
  .theme-toggle {
    border: 1px solid var(--border); background: var(--surface-1); color: var(--text-secondary);
    border-radius: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer;
  }

  .stats {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 1px; background: var(--gridline); border: 1px solid var(--border);
    border-radius: 10px; overflow: hidden; margin-bottom: 20px;
  }
  .stat { background: var(--surface-1); padding: 12px 14px; }
  .stat .label { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-muted); margin-bottom: 4px; }
  .stat .value { font-size: 18px; font-variant-numeric: tabular-nums; }
  .stat .value .unit { font-size: 12px; color: var(--text-secondary); font-weight: normal; margin-left: 2px; }

  .panel {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px 8px; margin-bottom: 12px;
  }
  .panel-title { position: relative; z-index: 2; font-size: 13px; color: var(--text-secondary); margin-bottom: 2px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap: 4px 14px;}
  /* Above the crosshair's pointer-capture layer, which spans the whole chart stack. */
  /* The toggles double as the legend: line toggles carry their series' swatch. */
  .panel-controls { position: relative; z-index: 2; display: flex; align-items: center; flex-wrap: wrap; gap: 4px 16px; margin: 4px 0 4px; }
  /* As many equal columns as fit without wrapping a label, set in drawToggleGrid;
     groups that don't fit wrap onto rows aligned with the ones above. */
  .toggle-grid {
    position: relative; z-index: 2; display: grid; grid-template-columns: minmax(0, 1fr);
    gap: 12px 20px; margin: 0 0 12px; padding: 12px 16px;
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px;
  }
  .toggle-group + .toggle-group { margin-top: 12px; }
  .toggle-group h3 { margin: 0 0 6px; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-muted); }
  .toggle-group .panel-toggle { padding: 2px 0; }
  .panel-toggle { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary); cursor: pointer; user-select: none; }
  .panel-toggle input { cursor: pointer; margin: 0; }
  .panel-toggle.disabled { opacity: 0.5; cursor: default; }
  .panel-toggle.disabled input { cursor: default; }
  .panel-choice { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px; font-size: 12px; color: var(--text-secondary); }
  .panel-choice.disabled > span { opacity: 0.5; }
  .panel-choice .swatch { width: 14px; height: 2px; flex: none; }
  .panel-choice.stacked { align-items: flex-start; gap: 6px; flex-wrap: nowrap; padding: 2px 0; }
  .panel-choice.stacked .ghost { visibility: hidden; margin: 0; }
  .panel-choice.stacked .swatch { align-self: center; visibility: hidden; }
  .panel-choice .choice-options { display: flex; gap: 10px; margin-top: 4px; }
  .panel-toggle .swatch { width: 14px; height: 2px; border-radius: 2px; flex: none; }
  .gas-switch-tag { fill: var(--text-secondary); font-size: 9px; }

  .chart-toolbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .view-switch, .zoom-buttons {
    display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
    background: var(--surface-1);
  }
  .view-switch button, .zoom-bar button {
    border: none; background: none; color: var(--text-secondary); font-size: 13px;
    padding: 6px 12px; cursor: pointer;
  }
  .view-switch button + button, .zoom-buttons button + button { border-left: 1px solid var(--border); }
  /* Zoom and pan; moved into the chart stack while a chart is maximized. */
  .zoom-bar { position: relative; z-index: 2; display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; gap: 8px; margin-left: auto; }
  #chart-stack > .zoom-bar { margin-bottom: 8px; }
  .zoom-buttons button { padding: 6px 10px; line-height: 0; }
  .zoom-buttons svg { overflow: visible; }
  .zoom-bar .zoom-reset { border: 1px solid var(--border); border-radius: 8px; background: var(--surface-1); }
  .zoom-bar button:not(:disabled):hover { color: var(--text-primary); }
  .zoom-bar button:disabled { opacity: 0.4; cursor: default; }
  .zoom-range:empty { display: none; }
  .zoom-range { font-size: 12px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .view-switch button[aria-pressed="true"] { background: var(--seq-100); color: var(--text-primary); }
  .band-divider { stroke: var(--baseline); stroke-width: 1; stroke-dasharray: 4 4; }

  svg { display: block; overflow: visible; }
  .gridline { stroke: var(--gridline); stroke-width: 1; }
  .baseline { stroke: var(--baseline); stroke-width: 1; }
  .axis-label { fill: var(--text-muted); font-size: 10px; font-variant-numeric: tabular-nums; }
  .crosshair { stroke: var(--text-muted); stroke-width: 1; stroke-dasharray: 2 2; pointer-events: none; }
  /* Halo in the surface color keeps labels readable where they cross lines. */
  .point-label {
    font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums;
    stroke: var(--surface-1); stroke-width: 3px; stroke-linejoin: round; paint-order: stroke;
    pointer-events: none;
  }

  #chart-stack { position: relative; }
  /* Over the plots, under the toggles; horizontal drags select, vertical ones scroll. */
  .crosshair-capture { position: absolute; z-index: 1; cursor: crosshair; touch-action: pan-y; user-select: none; }
  .zoom-selection {
    position: absolute; z-index: 1; pointer-events: none; visibility: hidden;
    background: var(--series-1); opacity: 0.12; border-left: 1px solid; border-right: 1px solid;
  }
  /* One chart filling the window; renderCharts sizes it to fit. */
  #chart-stack.maximized {
    position: fixed; inset: 0; z-index: 20; overflow: auto;
    padding: 16px; background: var(--page-plane);
  }
  #chart-stack.maximized .panel { margin-bottom: 8px; }
  html.chart-maximized { overflow: hidden; }
  .max-toggle {
    border: 1px solid var(--border); background: var(--surface-1); color: var(--text-muted);
    border-radius: 6px; padding: 5px; cursor: pointer; line-height: 0;
  }
  .max-toggle:hover { color: var(--text-primary); }
  .max-toggle svg { overflow: visible; }
  #tooltip {
    position: absolute; top: 0; left: 0; pointer-events: none; background: var(--surface-1);
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px;
    font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.15); white-space: nowrap;
    opacity: 0; transition: opacity 80ms; z-index: 10;
  }
  #tooltip .t-time { color: var(--text-secondary); margin-bottom: 4px; }
  #tooltip .t-row { display:flex; gap: 8px; align-items:center; }
  #tooltip .t-key { width: 10px; height: 2px; border-radius: 2px; }
  #tooltip .t-val { font-weight: 600; font-variant-numeric: tabular-nums; }
  #tooltip .t-name { color: var(--text-secondary); }

  .table-toggle {
    background: none; border: 1px solid var(--border); color: var(--text-secondary);
    border-radius: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer; margin: 8px 0 16px;
  }
  #table-wrap { display: none; max-height: 360px; overflow: auto; border: 1px solid var(--border); border-radius: 10px; }
  table { border-collapse: collapse; width: 100%; font-size: 12px; font-variant-numeric: tabular-nums; }
  th, td { padding: 6px 10px; text-align: right; border-bottom: 1px solid var(--gridline); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th { position: sticky; top: 0; z-index: 1; background: var(--surface-1); color: var(--text-secondary); font-weight: 600; vertical-align: bottom; box-shadow: inset 0 -1px 0 var(--border); }
  th .th-name { display: flex; align-items: center; justify-content: flex-end; gap: 6px; }
  th:first-child .th-name { justify-content: flex-start; }
  th .th-unit { color: var(--text-muted); font-weight: 400; font-size: 11px; }
  th .swatch { width: 10px; height: 2px; border-radius: 2px; flex: none; }
  tbody tr:hover td { background: var(--gridline); }
  td.deco { color: var(--status-critical); }
  td.active-tank { font-weight: 600; }
  tr.switch-row td {
    text-align: left; color: var(--text-secondary); font-size: 11px; font-weight: 600;
    background: var(--gridline); border-top: 1px solid var(--border);
  }

  #status { color: var(--text-secondary); font-size: 13px; }

  /* Isolated so Leaflet's high z-indexes stay under a maximized chart. */
  .map-container { height: 260px; border-radius: 8px; overflow: hidden; isolation: isolate; }
  /* Dark mode: invert the OSM raster tiles (not the marker) and darken the controls and popup. */
  .map-container.leaflet-container { background: var(--map-bg, #ddd); }
  .map-container .leaflet-tile-pane { filter: var(--map-tile-filter, none); }
  :root[data-theme="dark"] .map-container .leaflet-bar a,
  :root[data-theme="dark"] .map-container .leaflet-control-attribution,
  :root[data-theme="dark"] .map-container .leaflet-popup-content-wrapper,
  :root[data-theme="dark"] .map-container .leaflet-popup-tip { background: var(--surface-1); color: var(--text-secondary); border-color: var(--baseline); }
  :root[data-theme="dark"] .map-container .leaflet-control-attribution a { color: var(--series-1); }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .map-container .leaflet-bar a,
    :root:where(:not([data-theme="light"])) .map-container .leaflet-control-attribution,
    :root:where(:not([data-theme="light"])) .map-container .leaflet-popup-content-wrapper,
    :root:where(:not([data-theme="light"])) .map-container .leaflet-popup-tip { background: var(--surface-1); color: var(--text-secondary); border-color: var(--baseline); }
    :root:where(:not([data-theme="light"])) .map-container .leaflet-control-attribution a { color: var(--series-1); }
  }
</style>
</head>
<body>
<div class="viz-root" id="root">
  <div class="header">
    <div>
      <h1 id="dive-title">Loading dive…</h1>
      <div class="sub" id="dive-sub"></div>
    </div>
    <button class="theme-toggle" id="theme-toggle" type="button">Toggle theme</button>
  </div>

  <div id="status"></div>
  <div class="stats" id="stats"></div>
  <div class="chart-toolbar">
    <div class="view-switch" id="view-switch" role="group" aria-label="Chart layout">
      <button type="button" data-view="combined">Combined</button>
      <button type="button" data-view="separate">Separate</button>
    </div>
    <div class="zoom-bar" id="zoom-bar" role="toolbar" aria-label="Chart zoom">
      <span class="zoom-range" id="zoom-range" aria-live="polite"></span>
      <div class="zoom-buttons">
        <button type="button" data-zoom="left" aria-label="Pan earlier" title="Pan earlier (←)"><svg width="12" height="12" viewBox="0 0 10 10" aria-hidden="true"><path d="M6.5 1.5L3 5l3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button type="button" data-zoom="out" aria-label="Zoom out" title="Zoom out (−)"><svg width="12" height="12" viewBox="0 0 10 10" aria-hidden="true"><path d="M1.5 5h7" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button type="button" data-zoom="in" aria-label="Zoom in" title="Zoom in (+)"><svg width="12" height="12" viewBox="0 0 10 10" aria-hidden="true"><path d="M1.5 5h7M5 1.5v7" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button type="button" data-zoom="right" aria-label="Pan later" title="Pan later (→)"><svg width="12" height="12" viewBox="0 0 10 10" aria-hidden="true"><path d="M3.5 1.5L7 5 3.5 8.5" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
      <button type="button" class="zoom-reset" data-zoom="reset" title="Show the whole dive (0)">Reset zoom</button>
    </div>
  </div>
  <div id="chart-stack"></div>
  <div id="map-panel"></div>
  <button class="table-toggle" id="table-toggle" type="button">Show data table</button>
  <div id="table-wrap"><table id="table"></table></div>
  <div id="tooltip"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function () {
  const root = document.getElementById("root");
  const themeBtn = document.getElementById("theme-toggle");
  themeBtn.addEventListener("click", () => {
    const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    const cur = document.documentElement.getAttribute("data-theme") || (prefersDark ? "dark" : "light");
    const next = cur === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("divelog.theme", next); } catch (e) {}
  });

  const statusEl = document.getElementById("status");
  const tooltip = document.getElementById("tooltip");
  const stackEl = document.getElementById("chart-stack");

  const DEFAULT_MARGIN = { top: 8, right: 16, bottom: 20, left: 44 };
  // The combined chart needs room on the right for its banded scales' ticks.
  const COMBINED_MARGIN = { ...DEFAULT_MARGIN, right: 60 };

  function svgEl(tag, attrs) {
    const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
    for (const k in attrs) el.setAttribute(k, attrs[k]);
    return el;
  }

  // Standard gas name for an open-circuit mix given O2/He percentages.
  function mixName(o2, he) {
    if (o2 === null || o2 === undefined) return null;
    if (he > 0) return `Tx ${o2}/${he}`;
    if (o2 === 21) return "Air";
    if (o2 === 100) return "O2";
    return `EAN${o2}`;
  }

  // Maximum operating depth at the chosen PPO2 limit, in metres of seawater
  // (10 m per bar). The breathed mix comes from each sample's logged fractions.
  const MOD_PPO2 = 1.6;
  const modDepthM = (fractionO2) => (MOD_PPO2 / fractionO2 - 1) * 10;
  const sampleMixName = (s) => mixName(Math.round(s.fractionO2 * 100), Math.round((s.fractionHe || 0) * 100));

  // Display labels per tank slot, e.g. { name: "D1", mix: "EAN56", full: "EAN56 (D1)" }.
  // Falls back to "Tank N" for dives parsed before tank names were recorded.
  function tankLabelsFor(dive) {
    return [0, 1, 2, 3].map((i) => {
      const t = (dive.tanks || [])[i];
      const name = (t && t.name) || `Tank ${i + 1}`;
      const mix = t ? mixName(t.o2Percent, t.hePercent) : null;
      return { name, mix, full: mix ? `${mix} (${name})` : name };
    });
  }

  function fmtTime(sec) {
    sec = Math.round(sec);
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return m + ":" + String(s).padStart(2, "0");
  }

  // ---- scale helpers ----
  function makeScale(domain, range) {
    const [d0, d1] = domain, [r0, r1] = range;
    return (v) => r0 + ((v - d0) / (d1 - d0 || 1)) * (r1 - r0);
  }

  function niceTicks(min, max, count) {
    const span = max - min || 1;
    const rawStep = span / count;
    const mag = Math.pow(10, Math.floor(Math.log10(rawStep)));
    const norm = rawStep / mag;
    let step;
    if (norm < 1.5) step = 1 * mag;
    else if (norm < 3) step = 2 * mag;
    else if (norm < 7) step = 5 * mag;
    else step = 10 * mag;
    const start = Math.ceil(min / step) * step;
    const ticks = [];
    for (let v = start; v <= max + 1e-9; v += step) ticks.push(Math.round(v * 1000) / 1000);
    return ticks;
  }

  // Elapsed-time ticks on whole steps of the clock (10 s, 30 s, 1 min, 5 min, …),
  // about `count` across, so a zoomed-in axis still reads 12:30, 13:00, …
  const TIME_STEPS = [5, 10, 15, 30, 60, 120, 300, 600, 900, 1200, 1800, 3600];
  function timeTicks(min, max, count) {
    const rawStep = (max - min || 1) / count;
    const step = TIME_STEPS.find((s) => s >= rawStep) || TIME_STEPS[TIME_STEPS.length - 1];
    const ticks = [];
    for (let v = Math.ceil(min / step) * step; v <= max + 1e-9; v += step) ticks.push(v);
    return ticks;
  }

  // Detect gas switches. A change in the logged O2/He fractions is the
  // computer's own record of a switch, so it's taken as definitive. Between
  // those, the diver may still move between tanks carrying the same mix
  // (e.g. two air sidemount tanks), which only shows up in the pressures.
  // Each switch names the tanks involved where known, plus the mixes.
  function detectGasSwitches(samples, tanks) {
    const mixOf = (s) => ({ o2: Math.round(s.fractionO2 * 100), he: Math.round((s.fractionHe || 0) * 100) });
    const sameMix = (a, b) => a.o2 === b.o2 && a.he === b.he;

    // Split the dive into segments of constant logged mix.
    const segments = [];
    samples.forEach((s, i) => {
      const mix = mixOf(s), last = segments[segments.length - 1];
      if (last && sameMix(last.mix, mix)) last.end = i;
      else segments.push({ mix, start: i, end: i });
    });

    // Tanks that could be supplying each segment: those configured with its
    // mix, or, when the dive has no tank setup, any tank with readings.
    const tankCount = samples[0].tankPressureBar.length;
    const hasReadings = (tank) => samples.some((s) => s.tankPressureBar[tank] !== null);
    const allTanks = [...Array(tankCount).keys()];
    const configured = (tank) => tanks && tanks[tank] && tanks[tank].o2Percent != null;
    const candidatesFor = (mix) => {
      const matching = allTanks.filter((tank) => configured(tank)
        && sameMix(mix, { o2: tanks[tank].o2Percent, he: tanks[tank].hePercent || 0 }));
      if (matching.length) return matching;
      return allTanks.filter((tank) => !configured(tank) && hasReadings(tank));
    };

    // Runs of "which tank is active" across the dive, each tagged with its mix.
    const runs = [];
    segments.forEach((seg) => {
      const candidates = candidatesFor(seg.mix);
      let segRuns = candidates.length > 1 ? pressureRuns(samples, candidates, seg.start, seg.end) : [];
      if (!segRuns.length) {
        // One candidate, or no clear draw: take the tank that dropped the most.
        let tank = candidates.length === 1 ? candidates[0] : null, bestDrop = 0;
        if (candidates.length > 1) {
          candidates.forEach((c) => {
            const p = samples.slice(seg.start, seg.end + 1).map((s) => s.tankPressureBar[c]).filter((v) => v !== null);
            if (p.length && p[0] - p[p.length - 1] > bestDrop) { bestDrop = p[0] - p[p.length - 1]; tank = c; }
          });
        }
        segRuns = [{ tank, start: seg.start }];
      }
      segRuns[0].start = seg.start;
      segRuns.forEach((r) => runs.push({ tank: r.tank, start: r.start, mix: seg.mix }));
    });

    const events = [];
    for (let i = 1; i < runs.length; i++) {
      const from = runs[i - 1], to = runs[i], index = to.start;
      events.push({
        t: samples[index].t, index,
        fromTank: from.tank === null ? null : from.tank + 1, toTank: to.tank === null ? null : to.tank + 1,
        fromMix: mixName(from.mix.o2, from.mix.he), toMix: mixName(to.mix.o2, to.mix.he),
        inferred: sameMix(from.mix, to.mix),
      });
    }
    return events;
  }

  // Infer which of the candidate tanks is being breathed over a stretch of the
  // dive from pressure trends: the tank in use drops steadily while the others
  // sit flat (aside from sensor noise). We scan a rolling window per tank
  // looking for a sustained, consistent drop, pick whichever tank has the
  // strongest such drop at each sample, and return runs of the "active tank".
  function pressureRuns(samples, candidates, start, end) {
    const WINDOW = 6;             // ~12s at 2s sampling — long enough to separate a real draw from noise
    const NOISE_TOLERANCE = 0.3;  // bar; small upward blips within this are sensor noise, not a refill
    const MIN_DROP = 1.0;         // bar over the window; minimum drop to count as "in use"
    const MIN_RUN = 6;            // minimum consecutive samples agreeing on the active tank

    const p = (tank, j) => samples[j].tankPressureBar[tank];

    // Consistent drop over the window starting at j, or 0 if there isn't one.
    function windowDrop(tank, j) {
      for (let k = j; k < j + WINDOW; k++) {
        const a = p(tank, k), b = p(tank, k + 1);
        if (a === null || b === null || b - a > NOISE_TOLERANCE) return 0;
      }
      const drop = p(tank, j) - p(tank, j + WINDOW);
      return drop >= MIN_DROP ? drop : 0;
    }

    // Collapse into runs of the strongest-dropping tank, ignoring indices with no clear answer.
    const runs = [];
    for (let j = start; j + WINDOW <= end; j++) {
      let best = -1, bestDrop = 0;
      candidates.forEach((tank) => {
        const drop = windowDrop(tank, j);
        if (drop > bestDrop) { best = tank; bestDrop = drop; }
      });
      if (best === -1) continue;
      const last = runs[runs.length - 1];
      if (last && last.tank === best) { last.end = j; last.len++; }
      else runs.push({ tank: best, start: j, end: j, len: 1 });
    }

    // Discard short runs (noise blips) by folding them into the previous run.
    const filtered = [];
    runs.forEach((r) => {
      if (r.len < MIN_RUN && filtered.length) filtered[filtered.length - 1].end = r.end;
      else filtered.push({ ...r });
    });
    // Re-merge any adjacent runs that ended up sharing the same tank.
    const merged = [];
    filtered.forEach((r) => {
      const last = merged[merged.length - 1];
      if (last && last.tank === r.tank) last.end = r.end;
      else merged.push(r);
    });
    return merged;
  }

  // "EAN56 (D1) → EAN86 (D2)", falling back to the logged mix where the tank isn't known.
  function switchText(e, tankLabels) {
    const side = (tank, mix) => (tank ? tankLabels[tank - 1].full : mix);
    return `Gas switch: ${side(e.fromTank, e.fromMix)} → ${side(e.toTank, e.toMix)}`;
  }

  // Split the dive into segments at each gas switch and collect the tank
  // pressures worth labelling: the active tank's pressure at the start of the
  // dive, both tanks' pressures at every shown switch (old tank's end, new
  // tank's start), and every tank's final pressure at the end of the dive.
  function buildPressureLabels(samples, events, { isShown }) {
    const n = samples.length;
    const tankCount = samples[0].tankPressureBar.length;
    const at = (tank, i) => samples[i].tankPressureBar[tank];

    // Nearest non-null reading for a tank, searching backward or forward from
    // an index — tanks paired mid-dive have no readings before their first report.
    function reading(tank, from, dir) {
      for (let i = from; i >= 0 && i < n; i += dir) {
        const v = at(tank, i);
        if (v !== null && v !== undefined) return { index: i, v };
      }
      return null;
    }

    let firstTank;
    if (events.length && events[0].fromTank) {
      firstTank = events[0].fromTank - 1;
    } else {
      // No switches: the active tank is whichever one dropped the most.
      let bestDrop = -Infinity;
      for (let tank = 0; tank < tankCount; tank++) {
        const first = reading(tank, 0, 1), last = reading(tank, n - 1, -1);
        if (first && last && first.v - last.v > bestDrop) { bestDrop = first.v - last.v; firstTank = tank; }
      }
    }

    const labels = [];
    const push = (tank, r, side) => {
      if (tank >= 0 && r) labels.push({ tank, t: samples[r.index].t, v: r.v, side });
    };

    if (firstTank !== undefined) push(firstTank, reading(firstTank, 0, 1), "right");

    // A hidden switch still labels its new tank's starting pressure if that's
    // the first time the tank is used, so every tank gets a starting label.
    const labelled = new Set([firstTank]);
    events.forEach((e) => {
      const tank = e.toTank - 1;
      if (isShown(e)) push(e.fromTank - 1, reading(e.fromTank - 1, Math.max(0, e.index - 1), -1), "left");
      else if (labelled.has(tank)) return;
      labelled.add(tank);
      push(tank, reading(tank, e.index, 1), "right");
    });

    for (let tank = 0; tank < tankCount; tank++) push(tank, reading(tank, n - 1, -1), "left");

    return labels;
  }

  // Draw value labels next to their points, nudging each one vertically until
  // it clears every label placed before it (and any fixed obstacles such as
  // gas switch markers). Displaced labels get a thin leader back to their dot.
  function drawPointLabels(svg, labels, { xScale, yScale, top, bottom, obstacles }) {
    const GAP = 6, PAD = 2, STEP = 2;
    const placed = (obstacles || []).slice();
    const overlaps = (a, b) =>
      a.x < b.x + b.w + PAD && b.x < a.x + a.w + PAD && a.y < b.y + b.h + PAD && b.y < a.y + a.h + PAD;

    // Dots first, so they sit under every label and count as obstacles.
    labels.forEach((l) => {
      l.px = xScale(l.t);
      l.py = yScale(l.v);
      svg.appendChild(svgEl("circle", {
        cx: l.px, cy: l.py, r: 3, fill: l.color, stroke: "var(--surface-1)", "stroke-width": 1.5,
      }));
      placed.push({ x: l.px - 3, y: l.py - 3, w: 6, h: 6, owner: l });
    });

    labels.forEach((l) => {
      const text = svgEl("text", {
        class: "point-label", fill: l.color,
        x: l.side === "left" ? l.px - GAP : l.px + GAP,
        "text-anchor": l.side === "left" ? "end" : "start",
        "dominant-baseline": "central",
      });
      text.textContent = l.text;
      svg.appendChild(text);
      const box = text.getBBox();
      const h = box.height, w = box.width;
      const x = l.side === "left" ? l.px - GAP - w : l.px + GAP;
      const minY = top + h / 2, maxY = bottom - h / 2;
      const clamp = (y) => Math.min(maxY, Math.max(minY, y));
      // The label's own dot is right beside it; ignore it when testing.
      const others = placed.filter((p) => p.owner !== l);

      // Try the point's own height first, then step outward alternately up
      // and down; if nothing is free, fall back to the point's height.
      const start = clamp(l.py);
      let y = start;
      const reach = Math.max(start - minY, maxY - start);
      for (let d = 0; d <= reach; d += STEP) {
        const free = [start - d, start + d].find((cy) =>
          cy >= minY && cy <= maxY && !others.some((p) => overlaps({ x, y: cy - h / 2, w, h }, p)));
        if (free !== undefined) { y = free; break; }
      }

      text.setAttribute("y", y);
      placed.push({ x, y: y - h / 2, w, h });
      if (Math.abs(y - l.py) > 3) {
        const edgeX = l.side === "left" ? l.px - GAP + 2 : l.px + GAP - 2;
        svg.insertBefore(svgEl("line", {
          x1: l.px, y1: l.py, x2: edgeX, y2: y,
          stroke: l.color, "stroke-width": 1, opacity: 0.7,
        }), text);
      }
    });
  }

  // Panel registry so the shared crosshair can update every chart at once.
  const panels = [];
  // Gives each panel's clip path a unique id.
  let clipCount = 0;

  // Series, point labels and right-hand axes may each claim a horizontal
  // slice of the plot (`band`: [top, bottom] as fractions of the plot height)
  // with their own value domain, so several units can share one chart. Anything
  // without a band uses the panel's own y-domain across the full height.
  // `maximize` puts a Maximize / Restore button in the title row:
  // { maximized, onClick }.
  function drawPanel({ title, toggles, maximize, height, width, xDomain, series, yDomain, yFmt, invertY, bands, markers, pointLabels, pointLabelScale, rightAxes, dividers, margin, peaks, refLines }) {
    const MARGIN = margin || DEFAULT_MARGIN;
    const w = width, h = height;
    const innerW = w - MARGIN.left - MARGIN.right;
    const innerH = h - MARGIN.top - MARGIN.bottom;
    const bandTop = (f) => MARGIN.top + f * innerH;
    function scaleFor(spec) {
      if (!spec || !spec.band) return yScale;
      const [top, bottom] = spec.band.map(bandTop);
      return makeScale(spec.domain, spec.invert ? [top, bottom] : [bottom, top]);
    }

    const panelDiv = document.createElement("div");
    panelDiv.className = "panel";

    const titleRow = document.createElement("div");
    titleRow.className = "panel-title";
    const titleSpan = document.createElement("span");
    titleSpan.textContent = title;
    titleRow.appendChild(titleSpan);
    if (maximize) titleRow.appendChild(maximizeButton(maximize));
    panelDiv.appendChild(titleRow);

    const svg = svgEl("svg", {
      viewBox: `0 0 ${w} ${h}`, preserveAspectRatio: "none",
      style: `width:100%; height:${h}px; display:block;`,
    });
    panelDiv.appendChild(svg);
    if (toggles && toggles.length) panelDiv.appendChild(toggleRow(toggles));

    stackEl.appendChild(panelDiv);

    const xScale = makeScale(xDomain, [MARGIN.left, MARGIN.left + innerW]);
    const yRange = invertY ? [MARGIN.top, MARGIN.top + innerH] : [MARGIN.top + innerH, MARGIN.top];
    const yScale = makeScale(yDomain, yRange);

    // gridlines (y)
    const yTicks = niceTicks(yDomain[0], yDomain[1], 4);
    yTicks.forEach((tv) => {
      const y = yScale(tv);
      svg.appendChild(svgEl("line", { x1: MARGIN.left, x2: w - MARGIN.right, y1: y, y2: y, class: "gridline" }));
      const label = svgEl("text", { x: MARGIN.left - 8, y: y + 3, class: "axis-label", "text-anchor": "end" });
      label.textContent = yFmt ? yFmt(tv) : tv;
      svg.appendChild(label);
    });

    // band dividers, marking where each banded scale's slice begins/ends
    (dividers || []).forEach((f) => {
      const y = bandTop(f);
      svg.appendChild(svgEl("line", { x1: MARGIN.left, x2: w - MARGIN.right, y1: y, y2: y, class: "band-divider" }));
    });

    // right-hand tick labels for banded scales
    (rightAxes || []).forEach((a) => {
      const scale = scaleFor(a);
      niceTicks(a.domain[0], a.domain[1], a.ticks || 3).forEach((tv) => {
        const label = svgEl("text", {
          x: w - MARGIN.right + 8, y: scale(tv) + 3, class: "axis-label", "text-anchor": "start",
        });
        label.textContent = a.fmt ? a.fmt(tv) : tv;
        svg.appendChild(label);
      });
    });

    // Bands, reference lines, series and markers are clipped to the plot's
    // width, so a zoomed-in chart doesn't spill over its axes.
    const clipId = `plot-clip-${++clipCount}`;
    const defs = svgEl("defs", {});
    const clipPath = svgEl("clipPath", { id: clipId });
    clipPath.appendChild(svgEl("rect", { x: MARGIN.left, y: -h, width: Math.max(0, innerW), height: 3 * h }));
    defs.appendChild(clipPath);
    svg.appendChild(defs);
    const plot = svgEl("g", { "clip-path": `url(#${clipId})` });
    svg.appendChild(plot);
    const inView = (t) => t >= xDomain[0] && t <= xDomain[1];

    // shaded bands (e.g. deco ceiling zone, MOD floor)
    (bands || []).forEach((b) => {
      const path = b.points.map((p, i) => `${i === 0 ? "M" : "L"}${xScale(p.t)},${yScale(p.v)}`).join(" ");
      const baseY = yScale(b.base);
      const first = b.points[0], last = b.points[b.points.length - 1];
      const d = `${path} L${xScale(last.t)},${baseY} L${xScale(first.t)},${baseY} Z`;
      plot.appendChild(svgEl("path", { d, fill: b.color, opacity: b.opacity || 0.18, stroke: "none" }));
      // Optional dashed edge along the band's free side, lifted wherever the band has no height.
      if (b.outline) {
        let edge = "", penDown = false;
        b.points.forEach((p) => {
          if (p.v === b.base) { penDown = false; return; }
          edge += `${penDown ? "L" : "M"}${xScale(p.t)},${yScale(p.v)} `;
          penDown = true;
        });
        plot.appendChild(svgEl("path", {
          d: edge, fill: "none", stroke: b.color, "stroke-width": 1, "stroke-dasharray": "4 3", opacity: 0.8,
        }));
      }
    });

    // horizontal reference lines (e.g. the PPO2 limit), optionally on a banded scale
    (refLines || []).forEach((r) => {
      const y = scaleFor(r.scale)(r.v);
      plot.appendChild(svgEl("line", {
        x1: MARGIN.left, x2: w - MARGIN.right, y1: y, y2: y,
        stroke: r.color, "stroke-width": 1, "stroke-dasharray": "4 3", opacity: 0.8,
      }));
      if (r.text) {
        const label = svgEl("text", {
          class: "point-label", fill: r.color, x: w - MARGIN.right - 4, y: y - 3, "text-anchor": "end",
        });
        label.textContent = r.text;
        plot.appendChild(label);
      }
    });

    // series lines
    const seriesScales = series.map(scaleFor);
    series.forEach((s, si) => {
      const sScale = seriesScales[si];
      // Bars run from zero to each value, each spanning halfway to its
      // neighbouring samples, drawn as a single path.
      if (s.bars) {
        const pts = s.points;
        const y0 = sScale(0);
        let d = "";
        pts.forEach((p, i) => {
          if (p.v === null || p.v === undefined) return;
          const x = xScale(p.t);
          const left = i > 0 ? (x + xScale(pts[i - 1].t)) / 2 : x;
          const right = i < pts.length - 1 ? (x + xScale(pts[i + 1].t)) / 2 : x;
          d += `M${left},${y0} H${right} V${sScale(p.v)} H${left} Z `;
        });
        plot.appendChild(svgEl("path", { d, fill: s.color, stroke: "none" }));
        return;
      }
      let d = "";
      let penDown = false;
      s.points.forEach((p) => {
        if (p.v === null || p.v === undefined) { penDown = false; return; }
        const x = xScale(p.t), y = sScale(p.v);
        d += (penDown ? "L" : "M") + x + "," + y + " ";
        penDown = true;
      });
      plot.appendChild(svgEl("path", {
        d, fill: "none", stroke: s.color, "stroke-width": s.width || 2,
        "stroke-linejoin": "round", "stroke-linecap": "round",
        "stroke-dasharray": s.dashed ? "4 3" : null,
      }));
    });

    // gas switch markers (or similar point-in-time indicators), only those in view
    const shownMarkers = (markers || []).filter((m) => inView(m.t));
    shownMarkers.forEach((m) => {
      const x = xScale(m.t);
      plot.appendChild(svgEl("line", {
        x1: x, x2: x, y1: MARGIN.top, y2: MARGIN.top + innerH,
        stroke: "var(--text-secondary)", "stroke-width": 1, "stroke-dasharray": "3 3", opacity: 0.6,
      }));
      plot.appendChild(svgEl("path", {
        d: `M${x - 4},${MARGIN.top} L${x + 4},${MARGIN.top} L${x},${MARGIN.top + 7} Z`,
        fill: "var(--text-secondary)", opacity: 0.85,
      }));
    });

    // Labels and peaks are drawn only for points in view.
    const shownLabels = (pointLabels || []).filter((l) => inView(l.t));
    if (shownLabels.length) {
      // Gas switch triangles at the top of the plot are obstacles for labels.
      const obstacles = shownMarkers.map((m) => ({ x: xScale(m.t) - 4, y: MARGIN.top, w: 8, h: 7 }));
      const band = (pointLabelScale && pointLabelScale.band) || [0, 1];
      drawPointLabels(svg, shownLabels, {
        xScale, yScale: scaleFor(pointLabelScale), top: bandTop(band[0]), bottom: bandTop(band[1]), obstacles,
      });
    }

    // point markers (max depth, SurfGF, temperatures): a dot on the sample with
    // its value labelled just below (or `above`), centred or to the right, or
    // level with it on the left (`beside`), kept inside the plot horizontally.
    // `scale` places it on a banded scale.
    (peaks || []).filter((peak) => inView(peak.t)).forEach((peak) => {
      const px = xScale(peak.t), py = scaleFor(peak.scale)(peak.v);
      svg.appendChild(svgEl("circle", {
        cx: px, cy: py, r: 3.5, fill: peak.color, stroke: "var(--surface-1)", "stroke-width": 1.5,
      }));
      const text = svgEl("text", peak.beside ? {
        class: "point-label", fill: peak.color, x: px - 7, y: py,
        "text-anchor": "end", "dominant-baseline": "central",
      } : {
        class: "point-label", fill: peak.color, x: peak.align === "start" ? px + 5 : px, y: peak.above ? py - 7 : py + 7,
        "text-anchor": peak.align || "middle", "dominant-baseline": peak.above ? "auto" : "hanging",
      });
      text.textContent = peak.text;
      svg.appendChild(text);
      const box = text.getBBox();
      const shift = Math.max(MARGIN.left - box.x, 0) + Math.min(w - MARGIN.right - (box.x + box.width), 0);
      if (shift) text.setAttribute("x", Number(text.getAttribute("x")) + shift);
    });

    // baseline
    svg.appendChild(svgEl("line", {
      x1: MARGIN.left, x2: w - MARGIN.right,
      y1: yRange[invertY ? 0 : 1] === yRange[0] ? MARGIN.top + innerH : MARGIN.top,
      y2: yRange[invertY ? 0 : 1] === yRange[0] ? MARGIN.top + innerH : MARGIN.top,
      class: "baseline",
    }));

    const crosshair = svgEl("line", {
      x1: 0, x2: 0, y1: MARGIN.top, y2: MARGIN.top + innerH, class: "crosshair", visibility: "hidden",
    });
    svg.appendChild(crosshair);
    const dots = series.map((s) => {
      const c = svgEl("circle", { r: 3.5, fill: s.color, stroke: "var(--surface-1)", "stroke-width": 1.5, visibility: "hidden" });
      svg.appendChild(c);
      return c;
    });

    panels.push({ xScale, seriesScales, crosshair, dots, series, innerW, w, svg, margin: MARGIN });

    return panelDiv;
  }

  function maximizeButton({ maximized, onClick }) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "max-toggle";
    // Icon only: the label and tooltip say what it does.
    btn.setAttribute("aria-label", maximized ? "Restore chart" : "Maximize chart");
    btn.title = maximized ? "Restore to the normal size (Esc)" : "Fill the window with this chart";
    // Along the bottom-left to top-right diagonal: a double-headed arrow out
    // to the corners, or two arrows pointing back in to the middle.
    const icon = svgEl("svg", { width: 12, height: 12, viewBox: "0 0 10 10", "aria-hidden": "true" });
    icon.appendChild(svgEl("path", {
      d: maximized
        ? "M9.5 0.5L6 4M6 1v3h3M0.5 9.5L4 6M1 6h3v3"
        : "M1 9L9 1M5 1h4v4M1 5v4h4",
      fill: "none", stroke: "currentColor", "stroke-width": 1,
      "stroke-linecap": "round", "stroke-linejoin": "round",
    }));
    btn.appendChild(icon);
    btn.addEventListener("click", onClick);
    return btn;
  }

  function drawXAxis(width, xDomain, margin) {
    const MARGIN = margin || DEFAULT_MARGIN;
    const h = 26;
    const svg = svgEl("svg", {
      viewBox: `0 0 ${width} ${h}`, preserveAspectRatio: "none",
      style: `width:100%; height:${h}px; display:block;`,
    });
    const xScale = makeScale(xDomain, [MARGIN.left, width - MARGIN.right]);
    const ticks = timeTicks(xDomain[0], xDomain[1], 8);
    ticks.forEach((tv) => {
      const x = xScale(tv);
      const label = svgEl("text", { x, y: 12, class: "axis-label", "text-anchor": "middle" });
      label.textContent = fmtTime(tv);
      svg.appendChild(label);
    });
    const wrap = document.createElement("div");
    wrap.style.marginBottom = "8px";
    wrap.appendChild(svg);
    stackEl.appendChild(wrap);
  }

  // One display toggle: { id, label, checked, onChange, swatch?: { color, dashed }, disabled?, title? }.
  // A swatch shows the line or band it controls, so the toggles double as the legend.
  // `spacer` keeps swatch-less labels lined up under the swatched ones in a column.
  function toggleEl(toggle, { spacer } = {}) {
    if (toggle.options) return choiceEl(toggle, { spacer });
    const toggleLabel = document.createElement("label");
    toggleLabel.className = "panel-toggle" + (toggle.disabled ? " disabled" : "");
    toggleLabel.dataset.toggle = toggle.id;
    if (toggle.title) toggleLabel.title = toggle.title;
    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = toggle.checked;
    checkbox.disabled = !!toggle.disabled;
    checkbox.addEventListener("change", () => toggle.onChange(checkbox.checked));
    toggleLabel.appendChild(checkbox);
    if (toggle.swatch || spacer) {
      const sw = document.createElement("span");
      sw.className = "swatch";
      const { color, dashed } = toggle.swatch || {};
      if (color) {
        sw.style.background = dashed ? `repeating-linear-gradient(90deg, ${color} 0 4px, transparent 4px 7px)` : color;
      }
      toggleLabel.appendChild(sw);
    }
    const text = document.createElement("span");
    text.textContent = toggle.label;
    toggleLabel.appendChild(text);
    return toggleLabel;
  }

  // A set of radio buttons in place of a toggle:
  // { id, label, options: [{ value, label }], value, onChange, disabled? }.
  // Each option is its own .panel-toggle so focus survives a redraw. In a
  // legend column (`spacer`), the label and options stack, lined up with the
  // toggle labels above, to keep the column narrow.
  function choiceEl(choice, { spacer } = {}) {
    const row = document.createElement("div");
    row.className = "panel-choice" + (choice.disabled ? " disabled" : "") + (spacer ? " stacked" : "");
    row.setAttribute("role", "radiogroup");
    row.setAttribute("aria-label", choice.label);
    let body = row;
    if (spacer) {
      // An invisible checkbox and swatch take the same room as a toggle's.
      const ghost = document.createElement("input");
      ghost.type = "checkbox";
      ghost.className = "ghost";
      ghost.tabIndex = -1;
      ghost.setAttribute("aria-hidden", "true");
      row.appendChild(ghost);
      const sw = document.createElement("span");
      sw.className = "swatch";
      row.appendChild(sw);
      body = document.createElement("div");
      body.className = "choice-body";
      row.appendChild(body);
    }
    const text = document.createElement("span");
    text.textContent = choice.label;
    body.appendChild(text);
    const options = spacer ? document.createElement("div") : body;
    if (spacer) {
      options.className = "choice-options";
      body.appendChild(options);
    }
    choice.options.forEach((opt) => {
      const optLabel = document.createElement("label");
      optLabel.className = "panel-toggle" + (choice.disabled ? " disabled" : "");
      optLabel.dataset.toggle = `${choice.id}-${opt.value}`;
      const radio = document.createElement("input");
      radio.type = "radio";
      radio.name = choice.id;
      radio.checked = opt.value === choice.value;
      radio.disabled = !!choice.disabled;
      radio.addEventListener("change", () => { if (radio.checked) choice.onChange(opt.value); });
      optLabel.appendChild(radio);
      optLabel.appendChild(document.createTextNode(opt.label));
      options.appendChild(optLabel);
    });
    return row;
  }

  // A row of toggles, placed under the chart they control in the Separate view.
  function toggleRow(toggles) {
    const controls = document.createElement("div");
    controls.className = "panel-controls";
    toggles.forEach((toggle) => controls.appendChild(toggleEl(toggle)));
    return controls;
  }

  // Grouped toggles under the combined chart. `layouts` lists arrangements to
  // try, widest first: each a list of columns, each a list of { title, toggles }
  // groups stacked top to bottom.
  function drawToggleGrid(layouts) {
    const grid = document.createElement("div");
    grid.className = "toggle-grid";
    stackEl.appendChild(grid);
    const style = getComputedStyle(grid);
    const room = grid.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight);
    const gap = parseFloat(style.columnGap);

    // Lay out one arrangement of the groups; returns its columns' natural widths.
    function build(columns) {
      grid.innerHTML = "";
      columns.forEach((groups) => {
        const col = document.createElement("div");
        col.style.width = "max-content";
        groups.forEach(({ title, toggles }) => {
          const group = document.createElement("div");
          group.className = "toggle-group";
          const heading = document.createElement("h3");
          heading.textContent = title;
          group.appendChild(heading);
          toggles.forEach((toggle) => group.appendChild(toggleEl(toggle, { spacer: true })));
          col.appendChild(group);
        });
        grid.appendChild(col);
      });
      const cols = [...grid.children];
      const widths = cols.map((col) => col.getBoundingClientRect().width);
      cols.forEach((col) => { col.style.width = ""; });
      return widths;
    }
    const fits = (widest, n) => widest * n + gap * (n - 1) <= room;

    // The first arrangement whose columns all fit on one row of equal-width
    // columns, each as wide as the widest group. Failing that, the last one,
    // wrapped onto as many columns as fit; a single column (on a phone) lets
    // long labels wrap instead.
    let n;
    for (const [i, columns] of layouts.entries()) {
      const widest = Math.max(...build(columns));
      n = columns.length;
      if (fits(widest, n)) break;
      if (i === layouts.length - 1) while (n > 1 && !fits(widest, n)) n--;
    }
    grid.style.gridTemplateColumns = n > 1 ? `repeat(${n}, minmax(0, 1fr))` : "";
  }

  // `vis` is the display toggles: the tooltip leaves out whatever is switched off.
  // `ascentRates` is the smoothed ascent rate per sample (m/min, ascending positive).
  // Dragging across the charts selects a period, passed to `onSelect` as [t0, t1].
  function setupCrosshair(samples, width, xDomain, gasSwitchEvents, colors, tankLabels, vis, ascentRates, onSelect) {
    const MARGIN = panels[0].margin;
    const overlay = svgEl("svg", { width, height: 2, style: "position:absolute; top:0; left:0; pointer-events:none;" });
    // Use a transparent full-height div for pointer capture instead of svg overlay,
    // since panels have varying heights.
    // Position/size the capture area from the first panel's actual rendered
    // box rather than its nominal SVG width — the panel's own CSS padding
    // makes the SVG (preserveAspectRatio="none") render a bit narrower than
    // its viewBox, so trusting the nominal width here drifts the mouse-to-time
    // mapping away from where the chart is actually drawn.
    const p0Rect = panels[0].svg.getBoundingClientRect();
    const stackRect = stackEl.getBoundingClientRect();
    const scaleX = p0Rect.width / panels[0].w;
    const plotLeft = p0Rect.left - stackRect.left + MARGIN.left * scaleX;
    const plotWidth = panels[0].innerW * scaleX;

    const capture = document.createElement("div");
    capture.style.top = "0";
    capture.style.left = plotLeft + "px";
    capture.style.width = plotWidth + "px";
    capture.style.height = stackEl.scrollHeight + "px";
    capture.className = "crosshair-capture";
    stackEl.appendChild(capture);

    // The selection being dragged out, shaded from the top of the first chart
    // to the bottom of the last.
    const selection = document.createElement("div");
    selection.className = "zoom-selection";
    const firstRect = panels[0].svg.getBoundingClientRect();
    const lastRect = panels[panels.length - 1].svg.getBoundingClientRect();
    selection.style.top = firstRect.top - stackRect.top + stackEl.scrollTop + "px";
    selection.style.height = lastRect.bottom - firstRect.top + "px";
    stackEl.appendChild(selection);
    // clientX where the button went down, while it's held.
    let dragFrom = null;
    const DRAG_MIN_PX = 4;
    const dragging = (evt) => dragFrom !== null && Math.abs(evt.clientX - dragFrom) >= DRAG_MIN_PX;
    function timeAt(clientX) {
      const rect = capture.getBoundingClientRect();
      const frac = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
      return frac * (xDomain[1] - xDomain[0]) + xDomain[0];
    }

    const xScale = panels[0].xScale;

    function nearestIndex(t) {
      let lo = 0, hi = samples.length - 1;
      while (lo < hi) {
        const mid = (lo + hi) >> 1;
        if (samples[mid].t < t) lo = mid + 1; else hi = mid;
      }
      return lo;
    }

    function move(evt) {
      const t = timeAt(evt.clientX);
      const idx = Math.max(0, Math.min(samples.length - 1, nearestIndex(t)));
      const s = samples[idx];
      const x = xScale(s.t);

      panels.forEach((p) => {
        p.crosshair.setAttribute("x1", x);
        p.crosshair.setAttribute("x2", x);
        p.crosshair.setAttribute("visibility", "visible");
        p.series.forEach((ser, i) => {
          const v = ser.points[idx] ? ser.points[idx].v : null;
          const dot = p.dots[i];
          if (v === null || v === undefined) { dot.setAttribute("visibility", "hidden"); return; }
          dot.setAttribute("cx", x);
          dot.setAttribute("cy", p.seriesScales[i](v));
          dot.setAttribute("visibility", "visible");
        });
      });

      // tooltip content: the period being selected, or the readings here
      tooltip.innerHTML = "";
      if (dragging(evt)) {
        const rect = capture.getBoundingClientRect();
        const a = Math.max(0, Math.min(rect.width, dragFrom - rect.left));
        const b = Math.max(0, Math.min(rect.width, evt.clientX - rect.left));
        selection.style.left = capture.offsetLeft + Math.min(a, b) + "px";
        selection.style.width = Math.abs(b - a) + "px";
        selection.style.visibility = "visible";
        const [t0, t1] = [timeAt(dragFrom), t].sort((x, y) => x - y);
        const row = document.createElement("div");
        row.className = "t-time";
        row.textContent = `Zoom to ${fmtTime(t0)} – ${fmtTime(t1)}`;
        tooltip.appendChild(row);
        placeTooltip(evt);
        return;
      }
      const timeRow = document.createElement("div");
      timeRow.className = "t-time";
      timeRow.textContent = fmtTime(s.t) + " elapsed";
      tooltip.appendChild(timeRow);
      const rowsData = [
        ...(vis.depth ? [["Depth", s.depth, "m", colors.depth]] : []),
        ...(vis.ceiling ? [[
          `Ceiling${s.firstStopDepth > 0 && s.depth < s.firstStopDepth ? " — exceeded" : ""}`,
          s.firstStopDepth, "m", "var(--status-critical)",
        ]] : []),
        ["NDL", s.ndlMin, "min", "var(--text-muted)"],
        ...(vis.ppo2 ? [["PPO2", s.ppo2, "atm", colors.ppo2]] : []),
        ...(vis.ascent && ascentRates[idx] !== null ? [[
          ascentRates[idx] < 0 ? "Descent rate" : "Ascent rate",
          Math.abs(ascentRates[idx]).toFixed(1), "m/min", colors.ascent,
        ]] : []),
        ...(vis.temp ? [["Temp", s.waterTempC, "°C", colors.temp]] : []),
        ...s.tankPressureBar.map((v, i) => [tankLabels[i].full, vis.tanks[i] ? v : null, "bar", colors.tanks[i]]),
      ];
      if (vis.mod && s.fractionO2) {
        const mod = modDepthM(s.fractionO2);
        const over = s.ppo2 > MOD_PPO2;
        // Just after the PPO2 row (or NDL, with PPO2 hidden).
        rowsData.splice(rowsData.findIndex((r) => r[0] === (vis.ppo2 ? "PPO2" : "NDL")) + 1, 0, [`MOD (${sampleMixName(s)})${over ? " — exceeded" : ""}`, mod.toFixed(1), "m", "var(--status-critical)"]);
      }
      rowsData.forEach(([name, val, unit, color]) => {
        if (val === null || val === undefined) return;
        const row = document.createElement("div");
        row.className = "t-row";
        const key = document.createElement("span");
        key.className = "t-key";
        key.style.background = color;
        const valSpan = document.createElement("span");
        valSpan.className = "t-val";
        valSpan.textContent = (typeof val === "number" ? (Number.isInteger(val) ? val : val.toFixed(2)) : val) + " " + unit;
        const nameSpan = document.createElement("span");
        nameSpan.className = "t-name";
        nameSpan.textContent = name;
        row.appendChild(key);
        row.appendChild(valSpan);
        row.appendChild(nameSpan);
        tooltip.appendChild(row);
      });

      const nearestSwitch = (gasSwitchEvents || [])
        .map((e) => ({ e, dist: Math.abs(e.index - idx) }))
        .sort((a, b) => a.dist - b.dist)[0];
      if (nearestSwitch && nearestSwitch.dist <= 3) {
        const row = document.createElement("div");
        row.className = "t-row";
        const valSpan = document.createElement("span");
        valSpan.className = "t-val";
        valSpan.textContent = switchText(nearestSwitch.e, tankLabels);
        row.appendChild(valSpan);
        tooltip.appendChild(row);
      }

      placeTooltip(evt);
    }

    // The tooltip lives in the stack (see renderCharts), so place it from there.
    function placeTooltip(evt) {
      const stackRect = stackEl.getBoundingClientRect();
      const px = evt.clientX - stackRect.left + stackEl.scrollLeft;
      let left = px + 12;
      if (left + tooltip.offsetWidth > stackEl.clientWidth) left = px - 12 - tooltip.offsetWidth;
      tooltip.style.left = left + "px";
      // Kept above the bottom of the stack, which it would otherwise stretch.
      const top = evt.clientY - stackRect.top + stackEl.scrollTop - 10;
      tooltip.style.top = Math.max(0, Math.min(top, capture.offsetHeight - tooltip.offsetHeight)) + "px";
      tooltip.style.opacity = "1";
    }

    function endDrag() {
      dragFrom = null;
      selection.style.visibility = "hidden";
    }
    capture.addEventListener("pointerdown", (evt) => {
      if (evt.button !== 0) return;
      dragFrom = evt.clientX;
      // Keeps the drag going when the pointer strays off the chart.
      capture.setPointerCapture(evt.pointerId);
      evt.preventDefault();
    });
    capture.addEventListener("pointerup", (evt) => {
      const selected = dragging(evt) && [timeAt(dragFrom), timeAt(evt.clientX)].sort((x, y) => x - y);
      endDrag();
      if (selected) onSelect(selected);
    });
    capture.addEventListener("pointercancel", endDrag);
    capture.addEventListener("pointermove", move);
    capture.addEventListener("pointerleave", () => {
      tooltip.style.opacity = "0";
      panels.forEach((p) => {
        p.crosshair.setAttribute("visibility", "hidden");
        p.dots.forEach((d) => d.setAttribute("visibility", "hidden"));
      });
    });
  }

  function buildTable(samples, { tankLabels, tanksInUse, gasSwitchEvents, colors }) {
    const table = document.getElementById("table");
    const blank = (v) => v === null || v === undefined;
    const fixed = (dp) => (v) => (blank(v) ? "–" : v.toFixed(dp));

    // Which tank is being breathed at each sample, from the detected gas switches.
    const tankIndex = (n) => (n ? n - 1 : null);
    const firstTank = gasSwitchEvents.length ? tankIndex(gasSwitchEvents[0].fromTank) : null;
    const activeTank = (index) => {
      let tank = firstTank;
      gasSwitchEvents.forEach((e) => { if (e.index <= index) tank = tankIndex(e.toTank); });
      return tank;
    };

    const cols = [
      { name: "Time", value: (s) => fmtTime(s.t) },
      { name: "Depth", unit: "m", value: (s) => fixed(1)(s.depth) },
      {
        name: "Ceiling", unit: "m",
        value: (s) => (s.firstStopDepth > 0 ? String(s.firstStopDepth) : "–"),
        className: (s) => (s.firstStopDepth > 0 ? "deco" : ""),
      },
      {
        // NDL reads 0 both at the surface and in deco; show which one it is.
        name: "NDL", unit: "min",
        value: (s) => (s.firstStopDepth > 0 ? "Deco" : s.ndlMin > 0 ? String(s.ndlMin) : "–"),
        className: (s) => (s.firstStopDepth > 0 ? "deco" : ""),
      },
      { name: "PPO2", unit: "atm", value: (s) => fixed(2)(s.ppo2) },
      { name: "Temp", unit: "°C", value: (s) => fixed(0)(s.waterTempC) },
      ...tanksInUse.map((i) => ({
        name: tankLabels[i].full, unit: "bar", color: colors.tanks[i],
        value: (s) => fixed(0)(s.tankPressureBar[i]),
        className: (s, index) => (activeTank(index) === i ? "active-tank" : ""),
        style: (s, index) => (activeTank(index) === i ? colors.tanks[i] : null),
      })),
    ];

    const thead = document.createElement("thead");
    const trh = document.createElement("tr");
    cols.forEach((c) => {
      const th = document.createElement("th");
      const name = document.createElement("div");
      name.className = "th-name";
      if (c.color) {
        const swatch = document.createElement("span");
        swatch.className = "swatch";
        swatch.style.background = c.color;
        name.appendChild(swatch);
      }
      name.appendChild(document.createTextNode(c.name));
      th.appendChild(name);
      const unit = document.createElement("div");
      unit.className = "th-unit";
      unit.textContent = c.unit || "\u00a0";
      th.appendChild(unit);
      trh.appendChild(th);
    });
    thead.appendChild(trh);
    table.appendChild(thead);

    const tbody = document.createElement("tbody");
    const addSampleRow = (s, index) => {
      const tr = document.createElement("tr");
      cols.forEach((c) => {
        const td = document.createElement("td");
        td.textContent = c.value(s, index);
        const cls = c.className && c.className(s, index);
        if (cls) td.className = cls;
        const color = c.style && c.style(s, index);
        if (color) td.style.color = color;
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    };
    const addSwitchRow = (e) => {
      const tr = document.createElement("tr");
      tr.className = "switch-row";
      const td = document.createElement("td");
      td.colSpan = cols.length;
      td.textContent = `${fmtTime(e.t)} · ${switchText(e, tankLabels)}`;
      tr.appendChild(td);
      tbody.appendChild(tr);
    };

    // Sample every 6th row (12s) to keep the table reasonably sized, plus a
    // marker row and the exact sample at each gas switch.
    const switchesAt = new Map(gasSwitchEvents.map((e) => [e.index, e]));
    samples.forEach((s, i) => {
      if (switchesAt.has(i)) {
        addSwitchRow(switchesAt.get(i));
        addSampleRow(s, i);
      } else if (i % 6 === 0) {
        addSampleRow(s, i);
      }
    });
    table.appendChild(tbody);
  }

  function renderMap(dive) {
    const coords = dive.coordinates;
    if (!coords || coords.lat == null || coords.lon == null) return;

    const panelDiv = document.createElement("div");
    panelDiv.className = "panel";
    const titleRow = document.createElement("div");
    titleRow.className = "panel-title";
    const titleSpan = document.createElement("span");
    titleSpan.textContent = "Dive location";
    titleRow.appendChild(titleSpan);
    panelDiv.appendChild(titleRow);

    const mapEl = document.createElement("div");
    mapEl.className = "map-container";
    panelDiv.appendChild(mapEl);
    document.getElementById("map-panel").appendChild(panelDiv);

    const map = L.map(mapEl).setView([coords.lat, coords.lon], 12);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    }).addTo(map);
    L.marker([coords.lat, coords.lon]).addTo(map)
      .bindPopup(dive.site || "Dive site")
      .openPopup();
  }

  async function main() {
    statusEl.textContent = "Loading dive data…";
    let index;
    try {
      index = await fetch("../data/dives.json").then((r) => r.json());
    } catch (e) {
      statusEl.textContent = "Could not load ../data/dives.json — serve this folder over http:// (see README).";
      return;
    }
    if (!index.length) {
      statusEl.textContent = "No dives found in data/dives.json.";
      return;
    }
    const first = index[0];
    const dive = await fetch("../data/" + first.file).then((r) => r.json());
    statusEl.textContent = "";

    document.getElementById("dive-title").textContent =
      `Dive #${dive.diveNumber} — ${dive.site || "Unknown site"}`;
    document.getElementById("dive-sub").textContent =
      [dive.startDate, dive.location, dive.buddy ? "Buddy: " + dive.buddy : null]
        .filter(Boolean).join(" · ");

    const samples = dive.samples;
    const tankLabels = tankLabelsFor(dive);
    const temps = samples.map((s) => s.waterTempC).filter((v) => v !== null);
    const avgTemp = temps.reduce((a, b) => a + b, 0) / temps.length;

    const stats = document.getElementById("stats");
    const statData = [
      ["Max depth", dive.maxDepthM, "m"],
      ["Dive time", fmtTime(dive.maxTimeSec), ""],
      ["Avg temp", avgTemp.toFixed(1), "°C"],
      ["Min temp", Math.min(...temps), "°C"],
      ["GF", `${dive.gfMin}/${dive.gfMax}`, ""],
      ["Deco time", fmtTime(samples.filter((s) => s.firstStopDepth > 0).length * 2), ""],
    ];
    statData.forEach(([label, value, unit]) => {
      const el = document.createElement("div");
      el.className = "stat";
      el.innerHTML = `<div class="label"></div><div class="value"></div>`;
      el.querySelector(".label").textContent = label;
      const valEl = el.querySelector(".value");
      valEl.textContent = value + " ";
      const unitEl = document.createElement("span");
      unitEl.className = "unit";
      unitEl.textContent = unit;
      valEl.appendChild(unitEl);
      stats.appendChild(el);
    });

    const xDomain = [samples[0].t, samples[samples.length - 1].t];
    const gasSwitchEvents = detectGasSwitches(samples, dive.tanks);
    // Display toggles, all on by default and remembered across visits. `tanks`
    // is per tank slot. Switches the computer recorded (a change of logged mix)
    // always show; switches inferred from pressure only with `inferredSwitches`.
    const vis = {
      depth: true, ceiling: true, mod: true, depthHighlight: true, maxDepth: true, surfGf: true,
      tanks: [true, true, true, true], inferredSwitches: true,
      ppo2: true, highlight: true,
      ascent: true, maxAscent: true,
      temp: true, startTemp: true, minTemp: true,
    };
    try {
      // Carry over the MOD and ceiling settings saved before the toggles were grouped.
      if (localStorage.getItem("divelog.showMod") === "false") vis.mod = false;
      if (localStorage.getItem("divelog.showCeiling") === "false") vis.ceiling = false;
      const saved = JSON.parse(localStorage.getItem("divelog.toggles")) || {};
      Object.keys(vis).forEach((k) => {
        const ok = k === "tanks"
          ? Array.isArray(saved.tanks) && saved.tanks.length === 4 && saved.tanks.every((v) => typeof v === "boolean")
          : typeof saved[k] === "boolean";
        if (ok) vis[k] = saved[k];
      });
    } catch (e) {}
    // A toggle for one of the flags in `vis`; `tank` picks a slot of vis.tanks.
    // `title` is the full description, shown on hover beside the short label.
    function visToggle(label, key, { swatch, disabled, tank, title } = {}) {
      return {
        id: tank === undefined ? key : `tank${tank}`, label, swatch, disabled, title,
        checked: tank === undefined ? vis[key] : vis.tanks[tank],
        onChange: (checked) => {
          if (tank === undefined) vis[key] = checked; else vis.tanks[tank] = checked;
          try { localStorage.setItem("divelog.toggles", JSON.stringify(vis)); } catch (e) {}
          renderCharts();
        },
      };
    }
    // Ascent rate smoothing window in seconds, remembered separately from the on/off toggles.
    const ASCENT_WINDOWS = [2, 4, 10];
    let ascentWindow = 10;
    try {
      const saved = Number(localStorage.getItem("divelog.ascentWindow"));
      if (ASCENT_WINDOWS.includes(saved)) ascentWindow = saved;
    } catch (e) {}
    const isShownSwitch = (e) => vis.inferredSwitches || !e.inferred;
    const shownSwitches = () => gasSwitchEvents.filter(isShownSwitch);

    const viewSwitch = document.getElementById("view-switch");
    let chartView = "combined";
    try { if (localStorage.getItem("divelog.chartView") === "separate") chartView = "separate"; } catch (e) {}
    function syncViewSwitch() {
      viewSwitch.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.view === chartView)));
    }
    syncViewSwitch();
    viewSwitch.addEventListener("click", (evt) => {
      const view = evt.target.closest("button")?.dataset.view;
      if (!view || view === chartView) return;
      chartView = view;
      try { localStorage.setItem("divelog.chartView", view); } catch (e) {}
      syncViewSwitch();
      renderCharts();
    });

    // The chart filling the window, by panel id ("combined", "depth", …), or
    // null. Not remembered across visits.
    let maximized = null;
    let scrollBeforeMax = 0;
    function setMaximized(id) {
      if (id && !maximized) scrollBeforeMax = window.scrollY;
      const restoring = maximized;
      maximized = id;
      stackEl.classList.toggle("maximized", !!id);
      document.documentElement.classList.toggle("chart-maximized", !!id);
      renderCharts();
      if (!id) window.scrollTo(0, scrollBeforeMax);
      // Keep focus on the button that was pressed, now in its other state.
      const btn = stackEl.querySelector(id ? ".max-toggle" : `[data-panel="${restoring}"] .max-toggle`);
      if (btn) btn.focus({ preventScroll: true });
    }
    const maximizeFor = (id) => ({
      maximized: maximized === id,
      onClick: () => setMaximized(maximized === id ? null : id),
    });
    document.addEventListener("keydown", (evt) => {
      if (evt.key === "Escape" && maximized) setMaximized(null);
    });

    // The period shown, as [t0, t1] seconds, or null for the whole dive. Set
    // by dragging across the charts or with the zoom bar; not remembered
    // across visits.
    const toolbarEl = document.querySelector(".chart-toolbar");
    const zoomBar = document.getElementById("zoom-bar");
    const zoomRange = document.getElementById("zoom-range");
    const MIN_ZOOM_SPAN = 30;
    const fullSpan = xDomain[1] - xDomain[0];
    let zoom = null;
    // Clamped to the dive, at least MIN_ZOOM_SPAN wide (grown about its
    // middle), and null once it covers the whole dive.
    function setZoom(range) {
      if (range) {
        const span = Math.min(fullSpan, Math.max(MIN_ZOOM_SPAN, range[1] - range[0]));
        const start = Math.max(xDomain[0], Math.min(xDomain[1] - span, (range[0] + range[1] - span) / 2));
        range = span >= fullSpan - 1e-6 ? null : [start, start + span];
      }
      zoom = range;
      syncZoomBar();
      renderCharts();
    }
    function zoomBy(factor) {
      const [a, b] = zoom || xDomain;
      const mid = (a + b) / 2, half = ((b - a) * factor) / 2;
      setZoom([mid - half, mid + half]);
    }
    // By a fraction of the period shown, later for positive `frac`.
    function panBy(frac) {
      if (!zoom) return;
      const step = (zoom[1] - zoom[0]) * frac;
      setZoom([zoom[0] + step, zoom[1] + step]);
    }
    const zoomActions = {
      in: () => zoomBy(0.5), out: () => zoomBy(2), reset: () => setZoom(null),
      left: () => panBy(-0.5), right: () => panBy(0.5),
    };
    function syncZoomBar() {
      const [a, b] = zoom || xDomain;
      const disabled = {
        in: b - a <= MIN_ZOOM_SPAN + 1e-6, out: !zoom, reset: !zoom,
        left: !zoom || a <= xDomain[0], right: !zoom || b >= xDomain[1],
      };
      const focused = zoomBar.contains(document.activeElement) && document.activeElement;
      zoomBar.querySelectorAll("[data-zoom]").forEach((btn) => { btn.disabled = disabled[btn.dataset.zoom]; });
      // A button disabled under the keyboard hands focus to one that still works.
      if (focused && focused.disabled) {
        const next = [...zoomBar.querySelectorAll("[data-zoom]")].find((btn) => !btn.disabled);
        if (next) next.focus({ preventScroll: true });
      }
      zoomRange.textContent = zoom ? `Showing ${fmtTime(a)} – ${fmtTime(b)} of ${fmtTime(xDomain[1])}` : "";
    }
    zoomBar.addEventListener("click", (evt) => {
      const action = zoomActions[evt.target.closest("[data-zoom]")?.dataset.zoom];
      if (action) action();
    });
    // + / - / 0 and the arrow keys, unless typing or using a toggle.
    document.addEventListener("keydown", (evt) => {
      if (evt.ctrlKey || evt.metaKey || evt.altKey) return;
      if (evt.target.closest?.("input, select, textarea, [contenteditable]")) return;
      const action = { "+": "in", "=": "in", "-": "out", "_": "out", "0": "reset",
        ArrowLeft: zoom && "left", ArrowRight: zoom && "right" }[evt.key];
      if (!action) return;
      evt.preventDefault();
      zoomActions[action]();
    });
    syncZoomBar();

    const DEPTH_HEIGHT = 264;
    const depthMax = Math.max(...samples.map((s) => s.depth || 0)) * 1.08;
    const maxPpo2 = Math.max(...samples.map((s) => s.ppo2 || 0));
    // Grow past 1.8 atm when the dive did, so high readings aren't clipped.
    const ppo2Domain = [0, Math.max(1.8, Math.ceil(maxPpo2 * 10 - 1e-9) / 10)];
    const tankMax = Math.max(...samples.flatMap((s) => s.tankPressureBar.filter((v) => v !== null))) * 1.05;
    const tempDomain = [Math.min(...temps) - 1, Math.max(...temps) + 1];
    // Series colors are shared by both views so each one reads the same in
    // either layout. Tanks: blue, red, yellow, green.
    const COLORS = {
      depth: "var(--depth-line)",
      ppo2: "var(--series-5)",
      ascent: "var(--series-6)",
      temp: "var(--text-muted)",
      tanks: ["var(--series-1)", "var(--series-2)", "var(--series-4)", "var(--series-3)"],
    };
    const tanksInUse = [0, 1, 2, 3].filter((i) => samples.some((s) => s.tankPressureBar[i] !== null));
    // Deco ceiling and MOD are both limits not to cross, so their bands share one look.
    const LIMIT_BAND = { color: "var(--status-critical)", opacity: 0.12, outline: true };
    // Deco ceiling, shaded up to the surface. Stepped at each change of stop depth.
    const decoBand = { ...LIMIT_BAND, points: [], base: 0 };
    samples.forEach((s, i) => {
      const v = s.firstStopDepth || 0;
      const prev = decoBand.points[decoBand.points.length - 1];
      if (i && prev.v !== v) decoBand.points.push({ t: s.t, v: prev.v });
      decoBand.points.push({ t: s.t, v });
    });
    // Depth wherever the diver is shallower than the ceiling, drawn in red over
    // the profile. Each breach reaches to its neighbouring samples so a single
    // sample still draws as a segment.
    const overCeiling = samples.map((s) => s.firstStopDepth > 0 && s.depth < s.firstStopDepth);
    const overCeilingSeries = {
      name: "Over ceiling", color: "var(--status-critical)", width: 2.5,
      points: samples.map((s, i) => ({
        t: s.t, v: overCeiling[i] || overCeiling[i - 1] || overCeiling[i + 1] ? s.depth : null,
      })),
    };
    // MOD of the gas being breathed, shaded from there to the bottom of the
    // chart (`bottom`, in m). Stepped at each change of mix; deeper than the
    // chart means no band.
    function modBandTo(bottom) {
      const band = { ...LIMIT_BAND, points: [], base: bottom };
      samples.forEach((s, i) => {
        const v = Math.min(modDepthM(s.fractionO2), bottom);
        const prev = band.points[band.points.length - 1];
        if (i && prev.v !== v) band.points.push({ t: s.t, v: prev.v });
        band.points.push({ t: s.t, v });
      });
      return band;
    }
    // Depth wherever the logged PPO2 is over the limit, drawn in red over the profile.
    const overLimitSeries = {
      name: "Over MOD", color: "var(--status-critical)", width: 2.5,
      points: samples.map((s) => ({ t: s.t, v: s.ppo2 > MOD_PPO2 ? s.depth : null })),
    };
    const depthBands = (bottom) => [vis.ceiling && decoBand, vis.mod && modBandTo(bottom)].filter(Boolean);
    // The red breaches on the depth profile, each shown with the limit it crosses.
    const limitOverlays = () => (vis.depthHighlight
      ? [vis.mod && overLimitSeries, vis.ceiling && overCeilingSeries].filter(Boolean)
      : []);
    // PPO2 over the limit, drawn in red over the PPO2 line, reaching to its
    // neighbouring samples like the depth breaches do.
    const overPpo2 = samples.map((s) => s.ppo2 > MOD_PPO2);
    const overPpo2Series = {
      name: "PPO2 over limit", color: "var(--status-critical)", width: 2.5,
      points: samples.map((s, i) => ({
        t: s.t, v: overPpo2[i] || overPpo2[i - 1] || overPpo2[i + 1] ? s.ppo2 : null,
      })),
    };
    const worstPpo2 = samples.reduce((a, b) => (b.ppo2 > a.ppo2 ? b : a));
    // The worst reading, marked on the PPO2 line.
    const overLimitPeak = (scale) => worstPpo2.ppo2 > MOD_PPO2 && {
      t: worstPpo2.t, v: worstPpo2.ppo2, scale, color: "var(--status-critical)", beside: true,
      text: `PPO2 ${worstPpo2.ppo2.toFixed(2)} @ ${worstPpo2.depth.toFixed(1)} m`,
    };
    const ppo2LimitLine = (scale) => ({ v: MOD_PPO2, scale, color: "var(--status-critical)", text: `${MOD_PPO2}` });
    const pointsOf = (fn) => samples.map((s) => ({ t: s.t, v: fn(s) }));
    // Water temperature at the start of the dive and where it first bottoms out.
    const tempSamples = samples.filter((s) => s.waterTempC !== null);
    const coldest = tempSamples.reduce((a, b) => (b.waterTempC < a.waterTempC ? b : a));
    const tempPeaks = (scale) => (vis.temp ? [
      // Both labelled above the line, clear of the trace as it falls away.
      vis.startTemp && { t: tempSamples[0].t, v: tempSamples[0].waterTempC, scale, color: COLORS.temp, align: "start", above: true,
        text: `${tempSamples[0].waterTempC.toFixed(0)}°C` },
      vis.minTemp && { t: coldest.t, v: coldest.waterTempC, scale, color: COLORS.temp, align: "start", above: true,
        text: `Min ${coldest.waterTempC.toFixed(0)}°C` },
    ].filter(Boolean) : []);
    // Ascent rate in m/min (ascending positive), from the depth change across a
    // window of `ascentWindow` seconds centred on each sample. Shorter windows
    // show brief spikes; longer ones the sustained rate. Cached per window.
    const ascentCache = {};
    function ascentRates() {
      if (ascentCache[ascentWindow]) return ascentCache[ascentWindow];
      const interval = samples.length > 1 ? samples[1].t - samples[0].t : 2;
      const steps = Math.max(1, Math.round(ascentWindow / interval));
      const rates = samples.map((s, i) => {
        const a = Math.max(0, i - Math.floor(steps / 2));
        const b = Math.min(samples.length - 1, a + steps);
        const from = samples[a], to = samples[b];
        if (b <= a || from.depth == null || to.depth == null) return null;
        return ((from.depth - to.depth) / (to.t - from.t)) * 60;
      });
      return (ascentCache[ascentWindow] = rates);
    }
    // Symmetric about zero isn't needed: each side rounds up to the next 5 m/min.
    function ascentDomain() {
      const rates = ascentRates().filter((v) => v !== null);
      const up = Math.max(5, Math.ceil(Math.max(...rates) / 5) * 5);
      const down = Math.max(5, Math.ceil(-Math.min(...rates) / 5) * 5);
      return [-down, up];
    }
    const ascentSeries = (scale) => (vis.ascent ? [{
      name: "Ascent rate", color: COLORS.ascent, bars: true, points: samples.map((s, i) => ({ t: s.t, v: ascentRates()[i] })), ...scale,
    }] : []);
    // The fastest ascent, labelled to the left of its point.
    function ascentPeaks(scale) {
      if (!vis.ascent || !vis.maxAscent) return [];
      const rates = ascentRates();
      let best = 0;
      rates.forEach((v, i) => { if (v !== null && v > rates[best]) best = i; });
      if (!(rates[best] > 0)) return [];
      return [{
        t: samples[best].t, v: rates[best], scale, color: COLORS.ascent, beside: true,
        text: `Max ascent ${rates[best].toFixed(1)} m/min`,
      }];
    }
    // The zero line splits ascent (above) from descent (below) in the combined
    // chart, where the banded scale has no gridlines of its own.
    const ascentZeroLine = (scale) => ({ v: 0, scale, color: "var(--baseline)" });
    const deepest = samples.reduce((a, b) => ((b.depth || 0) > (a.depth || 0) ? b : a));
    const maxDepthPeak = {
      t: deepest.t, v: deepest.depth, color: COLORS.depth, text: `Max ${deepest.depth.toFixed(1)} m`,
    };
    // EndGF99 from Shearwater Cloud, marked where the diver reaches the surface
    // (the first zero-depth sample after the last one underwater).
    const lastUnderwater = samples.map((s) => s.depth > 0).lastIndexOf(true);
    const surfacing = samples[Math.min(lastUnderwater + 1, samples.length - 1)];
    const endGf99Marker = dive.endGf99 != null && {
      t: surfacing.t, v: surfacing.depth, color: COLORS.depth, align: "start", text: `SurfGF ${dive.endGf99}%`,
    };
    const depthPeaks = () => (vis.depth ? [vis.maxDepth && maxDepthPeak, vis.surfGf && endGf99Marker].filter(Boolean) : []);
    const ppo2Peaks = (scale) => (vis.ppo2 && vis.highlight && overLimitPeak(scale) ? [overLimitPeak(scale)] : []);
    const ppo2RefLines = (scale) => (vis.ppo2 && vis.mod ? [ppo2LimitLine(scale)] : []);
    const shownTanks = () => tanksInUse.filter((i) => vis.tanks[i]);
    const pressureLabelsFor = () =>
